workflows:
  android-debug-apk:
    name: Nahw Mir - Android APK Build
    max_build_duration: 30
    environment:
      node: latest
      java: 17
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: Add Android platform
        script: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
      - name: Sync web assets into Android project
        script: npx cap sync android
      - name: Build debug APK
        script: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

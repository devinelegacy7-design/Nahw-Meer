<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نحو میر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&family=Amiri&display=swap" rel="stylesheet">
<style>
:root{
  --font-ur:'Jameel Noori Nastaleeq','Noto Nastaliq Urdu','Segoe UI',sans-serif;
  --font-ar:'AlQalam Quran Majeed','Amiri','Scheherazade New',serif;
  --bg:#0f1410; --panel:#151b13; --card:#1a2119; --border:#2c352a;
  --text:#eef0e8; --muted:#9fae97; --accent:#c9a24b; --accent2:#7fae6f; --danger:#c96a4b;
  --active:#233420; --content-size:18px;
}
:root[data-theme="light"]{
  --bg:#faf8f2; --panel:#fff; --card:#fff; --border:#e3ddc9;
  --text:#232018; --muted:#6b6656; --accent:#9c7a2e; --accent2:#4c7a3c; --danger:#a8452a;
  --active:#f1ead1;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; font-family:var(--font-ur);
  background:var(--bg); color:var(--text);
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit;}
.app{display:flex; height:100vh; height:100dvh;}
#sidebar{
  width:290px; min-width:290px; background:var(--panel); border-left:1px solid var(--border);
  overflow-y:auto; padding:14px 10px; transition:transform .25s ease;
}
#sidebar h2{color:var(--accent); font-size:20px; margin:4px 8px 12px; text-align:center;}
.chapter{margin-bottom:4px;}
.chapter-row{
  width:100%; display:flex; align-items:center; gap:6px; padding:9px 8px; border-radius:8px; cursor:pointer;
  font-size:15px; font-weight:bold; background:none; border:none; color:var(--text); text-align:right; font-family:inherit;
}
.chapter-row:hover{background:var(--active);}
.chapter-row:focus-visible, .topic-row:focus-visible, .btn:focus-visible, #themeBtn:focus-visible, #menuBtn:focus-visible, .chapter-copy:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px;
}
.chapter-row.active-chapter{background:var(--active); color:var(--accent);}
.chapter-title{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.chapter-arrow{width:14px; opacity:.7; font-size:11px; flex-shrink:0;}
.chapter-copy{opacity:.55; font-size:12px; border:none; background:none; color:var(--muted); cursor:pointer; padding:4px 6px; flex-shrink:0;}
.chapter-copy:hover{color:var(--accent); opacity:1;}
.topics{padding-inline-start:22px; display:none;}
.topics.open{display:block;}
.topic-row{
  width:100%; padding:7px 8px; border-radius:6px; cursor:pointer; font-size:13.5px; color:var(--muted);
  border-inline-end:2px solid transparent; margin-bottom:1px; background:none; border-inline-start:none; border-top:none; border-bottom:none;
  text-align:right; font-family:inherit; display:block;
}
.topic-row:hover{background:var(--active); color:var(--text);}
.topic-row.active-topic{background:var(--active); color:var(--accent); border-inline-end-color:var(--accent); font-weight:bold;}
#main{flex:1; overflow-y:auto; display:flex; flex-direction:column;}
#topbar{
  position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--border);
  padding:10px 18px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
}
#menuBtn{display:none; background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:16px;}
#searchWrap{position:relative; flex:1; min-width:160px; max-width:480px;}
#searchBox{
  width:100%; padding:9px 40px 9px 34px; border-radius:10px; border:1px solid var(--border);
  background:var(--card); color:var(--text); font-size:15px; outline:none;
}
#searchBox:focus{border-color:var(--accent);}
.search-icon{position:absolute; right:12px; top:50%; transform:translateY(-50%); opacity:.6; pointer-events:none; font-size:14px;}
#searchClear{position:absolute; left:8px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; padding:4px 6px; display:none;}
#searchClear.show{display:block;}
#searchResults{
  position:absolute; top:110%; right:0; left:0; background:var(--card); border:1px solid var(--border);
  border-radius:10px; max-height:360px; overflow-y:auto; z-index:20; display:none; box-shadow:0 8px 24px rgba(0,0,0,.35);
}
#searchResults.open{display:block;}
.sr-item{padding:9px 12px; cursor:pointer; border-bottom:1px solid var(--border); font-size:13.5px;}
.sr-item:last-child{border-bottom:none;}
.sr-item:hover, .sr-item.sr-active{background:var(--active);}
.sr-path{color:var(--muted); font-size:11px; margin-bottom:2px;}
.sr-preview{color:var(--muted); font-size:12px; margin-top:3px;}
.sr-count{padding:7px 12px; color:var(--muted); font-size:11px; border-bottom:1px solid var(--border);}
.iconbtn{background:none; border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 10px; cursor:pointer; font-size:15px;}
#fontCtrl{display:flex; align-items:center; gap:2px; border:1px solid var(--border); border-radius:8px; overflow:hidden;}
#fontCtrl button{background:none; border:none; color:var(--text); padding:6px 10px; cursor:pointer; font-size:13px;}
#fontCtrl button:hover{background:var(--active); color:var(--accent);}
#breadcrumb{padding:12px 18px 0; color:var(--muted); font-size:13px;}
#breadcrumb button{cursor:pointer; background:none; border:none; color:var(--muted); font-family:inherit; font-size:13px; padding:0;}
#breadcrumb button:hover{color:var(--accent);}
#content{max-width:720px; margin:0 auto; padding:16px 18px 60px; width:100%;}
.content-header{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin:10px 0 6px; flex-wrap:wrap;}
.content-header h1{font-size:22px; color:var(--accent); margin:0;}
.btn{
  display:inline-flex; align-items:center; gap:6px; padding:7px 14px; border-radius:8px;
  background:transparent; border:1px solid var(--border); color:var(--muted); font-size:13px;
  cursor:pointer; font-family:inherit; transition:all .15s ease; white-space:nowrap;
}
.btn:hover{border-color:var(--accent); color:var(--accent);}
.btn.copied{border-color:var(--accent2); color:var(--accent2);}
.btn:disabled{opacity:.4; cursor:default;}
.btn:disabled:hover{border-color:var(--border); color:var(--muted);}
.chapter-overview-list{list-style:none; padding:0; margin:10px 0;}
.chapter-overview-list li{padding:0; border:1px solid var(--border); border-radius:10px; margin-bottom:8px; background:var(--card); overflow:hidden;}
.chapter-overview-list button.ov-btn{width:100%; text-align:right; background:none; border:none; color:inherit; font-family:inherit; padding:10px 12px; cursor:pointer;}
.chapter-overview-list li:hover{border-color:var(--accent);}
.chapter-overview-list .ov-title{font-weight:bold; color:var(--text); font-size:15px;}
.chapter-overview-list .ov-excerpt{color:var(--muted); font-size:12.5px; margin-top:4px;}
.chapter-meta{color:var(--muted); font-size:12px; margin:2px 0 12px;}
.topic-content{
  background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px;
  font-size:var(--content-size); line-height:2.1; white-space:pre-wrap; user-select:text;
}
mark{background:var(--accent); color:#000; border-radius:3px; padding:0 2px;}
.ar{font-family:var(--font-ar); font-size:1.08em;}
.navbtns{display:flex; justify-content:space-between; gap:10px; margin-top:22px;}
.navbtns .btn{flex:1; justify-content:center;}
#toast{
  position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--accent2); color:#08130a; padding:10px 20px; border-radius:30px; font-size:14px;
  transition:all .25s ease; pointer-events:none; z-index:50;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
#toast.err{background:var(--danger); color:#fff;}
.empty{text-align:center; color:var(--muted); padding:50px 10px;}
#overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:8;}
@media (max-width:820px){
  #sidebar{position:fixed; top:0; bottom:0; right:0; z-index:9; transform:translateX(100%); box-shadow:-6px 0 24px rgba(0,0,0,.4);}
  #sidebar.open{transform:translateX(0);}
  #overlay.show{display:block;}
  #menuBtn{display:inline-block;}
  #content{padding-inline:14px;}
  #fontCtrl{order:3; width:100%; justify-content:center;}
}
@media print{
  #sidebar,#topbar,#breadcrumb,#overlay,.navbtns,.content-header .btn,#toast{display:none !important;}
  #content{max-width:100%; padding:0;}
  .topic-content{border:none; padding:0;}
  body{background:#fff; color:#000;}
}
</style>
</head>
<body>
<div class="app">
  <div id="overlay" onclick="closeSidebar()"></div>
  <aside id="sidebar" aria-label="ابواب کی فہرست"><h2>نحو میر</h2><div id="chapterList"></div></aside>
  <main id="main">
    <div id="topbar">
      <button id="menuBtn" aria-label="مینیو کھولیں" aria-expanded="false" aria-controls="sidebar" onclick="toggleSidebar()">☰</button>
      <div id="searchWrap">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input id="searchBox" type="search" placeholder="لفظ، عنوان یا باب تلاش کریں..." aria-label="تلاش کریں" autocomplete="off">
        <button id="searchClear" aria-label="تلاش صاف کریں" onclick="clearSearch()">✕</button>
        <div id="searchResults" role="listbox"></div>
      </div>
      <div id="fontCtrl" role="group" aria-label="فونٹ سائز">
        <button aria-label="فونٹ چھوٹا کریں" onclick="changeFontSize(-1)">A-</button>
        <button aria-label="فونٹ درمیانہ کریں" onclick="changeFontSize(0)">A</button>
        <button aria-label="فونٹ بڑا کریں" onclick="changeFontSize(1)">A+</button>
      </div>
      <button id="themeBtn" class="iconbtn" aria-label="تھیم تبدیل کریں" onclick="toggleTheme()">🌓</button>
    </div>
    <div id="breadcrumb"></div>
    <div id="content"></div>
  </main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
const DATA = [{"id": "c0", "title": "تعارف و تمہید", "topics": [{"id": "c0t0", "title": "﷽", "content": "﷽"}, {"id": "c0t1", "title": "اَلْحَمْدُ لِلَّهِ الَّذِي جَعَلَ ا…", "content": "اَلْحَمْدُ لِلَّهِ الَّذِي جَعَلَ النَّحْوَ مِفْتَاحَ الْعِلْمِ، وَوَسِيلَةً لِفَهْمِ كَلَامِهِ وَرَسُولِهِ.\nوَالصَّلَاةُ وَالسَّلَامُ عَلَى خَيْرِ مَنْ بَلَّغَ الرِّسَالَةَ، وَعَلَى آلِهِ وَصَحْبِهِ الطَّاهِرِينَ."}, {"id": "c0t2", "title": "تعریف علم نحو", "content": "تعریف علم نحو: عِلْمٌ بِاُصُوْلٍ یُّعْرَفُ بِھَا اَحْوَالُ اَوَاخِرِالْکَلِمِ الثَّلَاثِ مِنْ حَیْثُ الْاِعْرَابِ وَالْبِنَاءِ وَکَیْفِیَّۃُ تَرْکِیْبِ بَعْضُھَا مَعَ بَعْضٍ (علم نحو وہ علم ہے جسکے ذریعے پہچانا جاتاہے اسم، فعل،حرف کے آخر کو معرب اور مبنی کے اعتبار سے اور بعض کلمات کو بعض سے ملانے کی کیفیت کا پتہ چلتا ہے)"}, {"id": "c0t3", "title": "غرض", "content": "غرض: صِیَانَۃُ الذِّھْنِ عَنِ الْخَطَائِ اللَّفْظِیْ فِی کَلَامِ الْعَرَبِ (محفوظ رکھنا ذہن کا لفظی غلطی سے عرب کے کلام میں)"}, {"id": "c0t4", "title": "موضوع", "content": "موضوع: اَلْکَلِمَۃُ وَالْکَلَامُ (کلمہ اور کلام)"}, {"id": "c0t5", "title": "پیغمبر اسلام ﷺ کی رحلت کے بعد خلفاء…", "content": "پیغمبر اسلام ﷺ کی رحلت کے بعد خلفاء اربعہ کے دور میں یکے بعد دیگرے اسلام دنیا میں پھیلتا گیااور سیّدنا        علی المرتضی ؓ کے دور میں تقریباً اسلام پوری دنیا میں پھیل چکا تھا لہذا عجمی لوگ بھی اسلام میں داخل ہونے لگے پھر عجمی لوگ عربی میں خلط ملط کرنے کے ساتھ ساتھ قرآن مجید کے اندر بھی غلطیوں کا ارتکاب کرنے لگے تو حضرت علی ؓ نے نحو کو ایجاد کرنے کی ضرورت محسوس کی۔\n\n ایک اعرابی نیا نیا مسلمان ہوکر مسجد نبوی ﷺ کے دروازے پر پہنچا تو مسجد کے اندر ایک عجمی تلاوت کر رہا تھا وہ جب سورۃ توبہ کی آیت (اِنَّ اللّٰہَ بَرِیٌ مِّنَ الْمَشْرِکِیْنَ وَرَسُوْلُہُ) پر پہنچا (یعنی اللہ اور اسکا رسول مشرکین سے بیزار ہیں) اس عجمی نے رَسُوْلُہُ کا عطف لفظ اللہ پر کرنےکے بجائے ’’اَلْمُشْرِکِیْنَ‘‘ پر کیا اور یو ں پڑھا رَسُوْلِہٖ یعنی مجرور پڑھا جسکے کے معنی یہ بن رہے ہیں کہ ’’اللہ مشکرین اور اپنے رسول سے بیزار ہے (نعوذ باللہ)‘‘اعرابی عربی دان تھا اسنے جب یہ آیت سنی تو کہا جب اللہ ا تَنْزِلُ بِنَا فَتُصِیْبَ خَیْرًا ( کیوں نیچے نہیں آتا تو نزدیک ہمارے، تاکہ پہنچے تو خیر اور بھلائی کو)"}, {"id": "c2t14", "title": "9.قسم", "content": "9.قسم: وہ جملہ ہے جس کے ذریعے کسی معزز چیز کا نام لے کر اپنی بات کو پختہ کیا جائے جیسےوَاللہِ لَاضْرِبَنَّ زَیْدًا ( اللہ کی قسم ضرور ماروں گا میں زید کو)"}, {"id": "c2t15", "title": "10.تعجب", "content": "10.تعجب:وہ جملہ ہے جس کے ذریعے حیرانگی کا اظہار کیا جائے جیسے مَااَحْسَنہٗ وَاَحْسِنْ بہٖ‎ ( وہ کتنا خوبصورت ہے!)"}]}, {"id": "c3", "title": "مرکب غیر مفید کے بیان میں", "topics": [{"id": "c3t0", "title": "مرکب غیر مفید", "content": "مرکب غیر مفید:   وہ ہے جو بولنے والا اس پر خاموشی اختيار  کرے اور سننے والے کو کو ئی خبر یا  طلب حاصل نا ہو۔مرکب غیر مفید کی تین اقسام ہیں \t1.مرکب اضافی\t2.مرکب بنائی\t3.مرکب منع صرف"}, {"id": "c3t1", "title": "مرکب اضافی", "content": "مرکب اضافی: جیسے غُلَامُ زَیْدٍ جز پہلی کو مضاف کہتے ہیں اور جز دوسری کو مضاف الیہ کہتے ہیں،اور مضاف الیہ ہمیشہ مجرور ہوتا ہے۔"}, {"id": "c3t2", "title": "مرکب بنائی", "content": "مرکب بنائی: وہ ہے جو دو اسموں کو ایک کریں اور دوسرا اسم  متضمن (اپنے اندر لینے والا)کسی حرف کا ہو۔جیسے اَحَدَ عَشَرَ سے لیکر تِسْعَۃَعَشَرَ تک جو اصل میں اَحَدٌوَّ عَشَرٌ اور تِسْعَۃٌ وَّ عَشَرٌتھے۔ واؤ کو حذف کیا اور دونوں اسموں کو ایک کیا، اور دونوں جزیں مبنی بر فتح ہیں مگر  اِثْنَا عَشَرَ  جو جز پہلی معرب ہے۔ جز دوسری مبنی ہے"}, {"id": "c3t3", "title": "مرکب منع صرف", "content": "مرکب منع صرف: وہ ہے جو دو اسموں کو ایک کریں اور دوسرا حرف متضمن (اپنے اندر لینے والا)کسی حرف کانا ہو، مثال کے طور پہ بَعْلَبَکَّ  اور حَضْرَ مَوْتُ جو جز پہلی مبنی بر فتح ہے اکژ علماء کے مذہب پر اور جز دوسری معرب۔"}, {"id": "c3t4", "title": "٭ جان تو جو مرکب غیر مفید ہمیشہ جز …", "content": "٭ جان تو جو مرکب غیر مفید ہمیشہ جز جملے کا ہوتا ہے جیسے غُلَامُ زَیْدٍ قَائِمٌ، عِنْدِیْ اَحَدَ عَشَرَ دِرْھَمًا، وَجَاءَ بَعْلَبَکُّ"}]}, {"id": "c4", "title": "جملہ کی ادنیٰ ترکیب کے بیان میں", "topics": [{"id": "c4t0", "title": "جان تو جو کوئی جملہ دو کلمات سے کم …", "content": "جان تو جو کوئی جملہ دو کلم بھی فُلْکٌ آتی ہے بروزن اُسْدٌ"}, {"id": "c10t24", "title": "جان تو جو جمع لفظ کے اعتبار سے دو ق…", "content": "جان تو جو جمع لفظ کے اعتبار سے دو قسم پر ہے \t1.جمع تکسیر\t2.جمع تصحیح"}, {"id": "c10t25", "title": "جمع تکسیر", "content": "جمع تکسیر:وہ ہے جو بنا واحد کی اس میں سلامت نا رہی ہوئی ہو جیسےرِجَالٌ اور مَسَاجِدُ، وزن جمع تکسیر کا ثلاثی میں سننے کے ساتھ تعلق رکھتا ہے اور قانون کو اس میں دخل نہیں ہے، لیکن رباعی اور خماسی میں فَعَالِلُ کے وزن پر آتا ہےجیسے جَعْفَرٌ سے جمع تکسیر جَعَافِرُ او ر جَحْمَرِشٌ سے جَحَامِرُ آتی ہے ۔"}, {"id": "c10t26", "title": "جمع تصحیح", "content": "جمع تصحیح : وہ ہے جو بنا واحد کی اس میں سلامت رہی ہوئی ہو اور وہ دو قسم پر ہے \t1.جمع مذکر\t2.جمع موئنث"}, {"id": "c10t27", "title": "جمع مذکر", "content": "جمع مذکر  : وہ ہے جو واؤ ما قبل مکسور اور نون مفتوحہ اس کے آخر میں ملی ہو ئی ہو جیسے مُسْلِمُوْنَ، یا یا ماقبل مکسور اور نون مفتوحہ اس کے آخر میں ملی ہوئی ہو جیسے مُسْلِمِیْنَ"}, {"id": "c10t28", "title": "جمع موئنث", "content": "جمع موئنث : وہ ہے جو  الف ساتھ تا کہ اس کے آخر میں ملے جیسے مُسْلِمَاتٌ"}, {"id": "c10t29", "title": "جان تو  جوجمع معنی کے اعتبار سے دو …", "content": "جان تو  جوجمع معنی کے اعتبار سے دو قسم پر ہے\t1.جمع قلّت \t2.جمع کثرت"}, {"id": "c10t30", "title": "جمع قلت", "content": "جمع قلت: وہ ہے جو دس(10) سے کم پر اطلاق کریں  اور اس کے چار وزن ہیں"}, {"id": "c10t31", "title": "اَفْعُلٌ  جیسے اَکْلُبٌ", "content": "اَفْعُلٌ  جیسے اَکْلُبٌ"}, {"id": "c10t32", "title": "اَفْعَالٌ جیسے اَقْوَالٌ", "content": "اَفْعَالٌ جیسے اَقْوَالٌ"}, {"id": "c10t33", "title": "اَفْعِلَۃٌ جیسے اَعْوِنَۃٌ", "content": "اَفْعِلَۃٌ جیسے اَعْوِنَۃٌ"}, {"id": "c10t34", "title": "فِعْلَۃٌ جیسے غِلْمَۃٌ", "content": "فِعْلَۃٌ جیسے غِلْمَۃٌ"}, {"id": "c10t35", "title": "٭ دو جمع تصحیح   بغیر الف لام کے(ال…", "content": "٭ دو جمع تصحیح   بغیر الف لام کے(الف لام اگر استغراقی ہو تو کثرت  کیلئے  آتا ہے)  یعنی مُسْلِمُوْنَ اور مُسْلِمَاتٌ"}, {"id": "c10t36", "title": "جمع کثرت", "content": "جمع کثرت: وہ ہے جو دس پر اور  دس سے زیادہ پر اطلاق کریں  اور اوزان جمع کثرت کےجمع قلت کے چھ (6) اوزان کے علاوہ ہیں۔"}]}, {"id": "c11", "title": "اسم متمکن کے بیان میں", "topics": [{"id": "c11t0", "title": "جان تو جو اعراب اسم کے تین ہیں \t1.ر…", "content": "جان تو جو اعراب اسم کے تین ہیں \t1.رفع\t\t2.نصب\t3.جر"}, {"id": "c11t1", "title": "اسم متمکن باعتبار وجوہ اعراب کے سول…", "content": "اسم متمکن باعتبار وجوہ اعراب کے سولہ (16) قسم پر ہے"}, {"id": "c11t2", "title": "مفرد منصرف صحیح", "content": "مفرد منصرف صحیح : جیسے زَیْدٌ ، مفرد  کا مطلب یہ ہے کہ تثنیہ یا جمع نا ہواور  منصرف کامطلب یہ ہے کہ اس اسم میں منع صرف کا کوئی سبب موجود نا ہو ،صحیح نحویوں کے نزدیک وہ کلمہ ہے جس کے آخر میں حرف علت نا ہو، زَیْدٌ نحویوں کے نزدیک صحیح ہے اگرچہ صرفیوں کے نزدیک معتل ہے۔"}, {"id": "c11t3", "title": "مفرد منصرف جاری مجرای صحیح", "content": "مفرد منصرف جاری مجرای صحیح : جیسے دَلْوٌ  ،  جاری مجرای صحیح وہ کلمہ ہوتا ہے  جس کے آخر میں حرف علت ہو اور ماقبل اس کا ساکن ہو۔"}, {"id": "c11t4", "title": "جمع مکسر منصرف", "content": "جمع مکسر منصرف: جیسے رِجَالٌ ، جمع مکسر وہ جمع ہے جس کی واحد کی بنا سلامت نا ہو اور اس میں منع صرف کا   سبب نا پایا جائے۔ \n٭ ان تین حالتوں کا اعراب حالت رفع، نصب و جر میں لفظی حرکتوں سے ہے ۔ ان کا رفع ضمے کے ساتھ، نصب فتح کے ساتھ  اور جر کسرے کے ساتھ ہوتاہے۔ جیسے جَاءَنِی زَیْدٌ ، رَأَیْتُ زَیْدً ، مَرَرْتُ بِزَیْدٍ\nجَاءَنِی دَلْوٌ، رَأَیْتُ دَلْوً ، مَرَرْتُ بِدَلْوٍ\nجَاءَنِی رِجَالٌ، رَأَیْتُ رِجَالً، مَرَرْتُ بِرِجَالٍ"}, {"id": "c11t5", "title": "جمع موئنث سالم", "content": "جمع موئنث سالم : وہ جمع تصحیح جس کے آخر میں الف اور تا ء کا اضافہ کیا گیا ہو ، اس کا رفع ضمے کے ساتھ، نصب اور جر کسرے کے ساتھ ہوتاہے جیسے :\nھُنَّ مُسْلِمَاتٌ، رَأَیْتُ مُسْلِمَاتٍ، مَرَرْتُ بِمُسْلِمَاتٍ"}, {"id": "c11t6", "title": "غیر منصرف", "content": "غیر منصرف : وہ اسم ہے جو منع صرف کے  جو دو اسباب یا ایک سبب  ایسا جو منع صرف کے دو اسباب کے قائم مقام ہو اس میں ہو ۔ منع کے صرف کے نو (9)اسباب ہیں ۔"}, {"id": "c11t7", "title": "عدل", "content": "عدل : اسم کا مادہ صورت اصلی سے نکالا جانا بایں طور کہ کسی قاعدہ صرفی پر مبنی نا ہو جیسے عُمَرُ"}, {"id": "c11t8", "title": "وصف", "content": "وصف:اسم کا ایسی ذات پر دلالت کرنا جو کسی صفت کے ساتھ متصف ہو جیسے اَحْمَرُ(سرخ)"}, {"id": "c11t9", "title": "تانیث", "content": "تانیث: اسم کا موئنث ہونا خواہ بایں طور کہ اس کے آخر میں  میں \"ۃ\" لگے جو حالت وقف میں \"ہ\"ہوجاتی ہے  جیسے طَلْحَۃُ (اس کو تانیث لفظی کہتے ہیں )یابایں طور کہ وہ کسی مادہ کا علم ہو جیسے زَیْنَبُ (اس کو موئنث معنوی کہتےہیں)"}, {"id": "c11t10", "title": "معرفہ", "content": "معرفہ: وہ اسم ہے جو کسی معین شے کے لئے وضع کیا گیا ہو جیسے اِبْرَاھِیْمُ"}, {"id": "c11t11", "title": "عجمہ", "content": "عجمہ: کلام عرب میں استعمال ہونے والا وہ اسم جو اصل وضع میں عجمی (غیر عربی ) ہو جیسے   اِبْرَاھِیْمُ جو کہ اصل میں سریانی زبان میں حضورﷺ کے جد امجد حضرت ابراہیم علیہ السلام  کا نام ہے"}, {"id": "c11t12", "title": "جمع", "content": "جمع: وہ اسم جو جمع منتہی  الجموع ہو جیسے مَسَاجِدُ"}, {"id": "c11t13", "title": "ترکیب", "content": "ترکیب: وہ مرکب جو دو اسموں کو ایک کر کے بنایا گیا ہو اور دوسرا اسم متضمن (اپنے اندر لینے والا)کسی حرف کا نا ہو جیسے مَعْدِیْکَرَبُ"}, {"id": "c11t14", "title": "وزن فعل", "content": "وزن فعل:اسم کا ایسے وزن پر ہونا جو اوزان فعل سے شمار کیا جاتا ہو جیسے اَحْمَدُ  کا اَفْعَلُ کے وزن پر ہونا"}, {"id": "c11t15", "title": "الف ونون زائدتان", "content": "الف ونون زائدتان: الف اور نون کا اسم کے آخر میں زائدہ ہونا جیسے سُلَیْمَانُ ، عُثْمَانُ ، عِمْرَانُ\n٭رفع  اس کا ضمے کے ساتھ، نصب اور جر  فتح کے ساتھ جَاءَ عُمَرُ، رَأَیْتُ عُمَرَ ،مَرَرَتُ بِعُمَرَ"}, {"id": "c11t16", "title": "اسمائے ستہ مکبرہ", "content": "اسمائے ستہ مکبرہ: اس وقت جو  مضاف ہوں طرف غیر یا متکلم کے  جیسے اَبٌ (باپ) ، اَخٌ(بھائی) ،حَمٌ (دیور)، ھَنٌ(شرم گاہ) ، فَمٌ( منہ)، ذُوْ مَالٍ( صاحب مال)\n٭ رفع ان کا واؤکے ساتھ ہوتا ہے ، نصب الف کے ساتھ اور جر یا کے ساتھ جیسے جَاءَ اَبُوْکَ، رَأَیْتُ اَبَاکَ، مَرَرَتُ بِاَبِیْکَ"}, {"id": "c11t17", "title": "مثنیٰ", "content": "مثنیٰ: یعنی تثنیہ جیسے  رَجُلَانِ"}, {"id": "c11t18", "title": "کِلَا کِلْتَا مضاف طرف ضمیروں کے", "content": "کِلَا کِلْتَا مضاف طرف ضمیروں کے"}, {"id": "c11t19", "title": "اِثْنَانِ اِثْنَتَانِ ", "content": "اِثْنَانِ اِثْنَتَانِ \n٭ ساتویں ،آٹھویں اور نویں قسم کا رفع ساتھ الف کے ، نصب اور جر ساتھ یا ماقبل مفتوح کے ہوتا ہے ۔\nجیسے جَاءَ رَجُلَانِ ، رَأَیْتُ رَجُلَیْنِ ، مَرَرْتُ بِرَجُلَیْنِ\n جَاءَ کِلَاھُمَا ، رَأَیْتُ کِلَیْھِمَا ، مَرَرْتُ بِکِلَیْھِمَا\nجَاءَاِثْنَانِ ، رَأَیْتُ اِثْنَیْنِ، مَرَرْتُ بِاِثْنَیْنِ"}, {"id": "c11t20", "title": "جمع مذکر سالم", "content": "جمع مذکر سالم :  جیسے مُسْلِمُوْ نَ"}, {"id": "c11t21", "title": "اُولُوْ", "content": "اُولُوْ"}, {"id": "c11t22", "title": "عِشْرُوْنَ سے تِسْعُوْنَ تک ( عِشْر…", "content": "عِشْرُوْنَ سے تِسْعُوْنَ تک ( عِشْرُوْنَ، ثَلٰثُوْنَ، اَرْبَعُوْنَ، خَمْسُوْنَ، سِتُّوْنَ، سَبْعُوْنَ، ثَمَانُوْنَ ، تِسْعُوْنَ)\n٭ دسویں ، گیارویں اور بارویں قسم کا رفع ساتھ واؤ ما قبل مضموم کےہوتا ہے ، نصب اور جر ساتھ یاء ماقبل مکسور کے ہوتا ہے جیسے جَاءَ مُسْلِمُوْنَ ، رَأَیْتُ مُسْلِمِیْنَ ، مَرَرْتُ بِمُسْلِمِیْنَ\nجَاءَ  اُولُوْ مَالٍ، رَأَیْتُ اُولِیْ مَالٍ ، مَرَرْتُ بِاُولِیْ مَالٍ\nجَاءَ عِشْرُوْنَ رَجُلًا ، رَأَیْتُ عِشْرِیْنَ رَجُلًا ، مَرَرْتُ  بِعِشْرِیْنَ رَجُلًا"}, {"id": "c11t23", "title": "الف مقصورہ", "content": "الف مقصورہ: وہ اسم ہوتا ہے جس کے آخر میں ہمزہ (ء) نا ہو، کیوں کہ اس کو لمبا کر کے نہیں پڑھا جاتا اس لئے اس کو الف مقصورہ کہتے ہیں جیسے مُوْسیٰ، عِیْسَیٰ"}, {"id": "c11t24", "title": "غیر جمع مذکر سالم مضاف طرف یا متکلم کے", "content": "غیر جمع مذکر سالم مضاف طرف یا متکلم کے: جیسے غُلَامِیْ\n٭ تیرویں اور چودویں قسم کا رفع ساتھ تقدیر ضمہ کے ، نصب ساتھ تقدیر فتح کے اور نصب اور جر ساتھ تقدیر کسرہ کے ہوتا ہے جیسے جَاءَ مُوْسیٰ ، رَأَیْتُ مُوْسیٰ ، مَرَرْتُ بِمُوْسیٰ\nجَاءَ غُلَامِیْ ، رَأَیْتُ غُلَامِیْ ، مَرَرْتُ بِغُلَامِیْ"}, {"id": "c11t25", "title": "اسم منقوص", "content": "اسم منقوص: وہ اسم ہے جو اس کے آخر میں یاء ماقبل مکسور ہو جیسے قَاضِیْ\n٭رفع اس کا ساتھ تقدیر ضمہ کے ، نصب ساتھ فتح لفظی  کے اور جر ساتھ تقدیر کسرہ کے ہوتا ہے جیسے   جَاءَ الْقَاضِیْ ، رَأَیْتُ الْقَاضِیَ ، مَرَرْتُ بِالْقَاضِیْ"}, {"id": "c11t26", "title": "جمع مذکر سالم مضاف طرف یا متکلم کے", "content": "جمع مذکر سالم مضاف طرف یا متکلم کے: جیسے   مُسْلِمِیَّ \n٭ رفع اس کا ساتھ تقدیر واؤ کے ، نصب اور جر ساتھ یا ءما قبل مکسور کے جیسے ھٰؤُلَآءِ مُسْلِمِیَّ ، رَأَیْتُ مُسْلِمِیَّ ، مَرَرْتُ بِمُسْلِمِیَّ جو اصل میں   مُسْلِمُوْنَ تھا نون وقت اضافت کے گر گئی  مُسْلِمُوْیَ ہو گیا ، واؤ اور یاء جمع ہوگئے     پہلا ساکن تھا اس کو ساتھ یا ء کہ تبدیل کیا تو مُسْلِمُیْیَ ہو گیا،یاء کا یاء میں ادغام کیا تو مُسْلِمُیَّ ہوگیا، میم کے ضمے کو کسرےکے ساتھ تبدیل کیا تاکہ دلالت کرے  یاء کے حذف ہونے پر  مُسْلِمِیّ ہوگیا"}]}, {"id": "c12", "title": "فعل مضارع کے اعراب کے بیان میں", "topics": [{"id": "c12t0", "title": "جان تو جو اعراب فعل مضارع کے تین ہی…", "content": "جان تو جو اعراب فعل مضارع کے تین ہیں \t1.رفع\t\t2.نصب\t3.جزم"}, {"id": "c12t1", "title": "مضارع باعتبار وجوہ اعراب کے چار  قس…", "content": "مضارع باعتبار وجوہ اعراب کے چار  قسم پر ہے"}, {"id": "c12t2", "title": "صحیح مجرد از ضمیر بارز مرفوع", "content": "صحیح مجرد از ضمیر بارز مرفوع:صحیح(   نحویوں کے نزدیک صحیح  وہ کلمہ ہے جس کے آخر میں حرف علت نا ہو )، مجرد(خالی)، بارز (جو ظاہر پڑھا جائے) ،   یعنی صحیح جو خالی ہو بارز مرفوع کی ضمیروں سے واسطے تثنیہ  ( یَضْرِبَانِ، تَضْرِبَانِ، تَضْرِبَانِ، تَضْرِبَانِ) ،جمع مذکر (یَضْرِبُوْنَ،تَضْرِبُوْنَ) ، واحد موئنث مخاطب ( تَضْرِبِیْنَ) ،جمع موئنث غائب(یَضْرِبْنَ) اور جمع موئنث مخاطب (تَضْرِبْنَ)، اور باقی رہے پانچ صیغےواحد مذکرغائب(یَضْرِبُ)، واحد موئنث غائب (تَضْرِبُ)،واحد مذکر مخاطب (تَضْرِبُ)، واحد متکلم ( اَضْرِبُ) ، جمع متکلم ( نَضْرِبُ)\n٭ رفع اس کا ساتھ ضمے کے ، نصب ساتھ فتح کے اور جزم ساتھ سکون کے ہوتی ہے،\n حالت رفع میں: ھُوَ یَضْرِبُ، اَنْتَ تَضْرِبُ، اَنْتِ تَضْرِبُ، اَنَا اَضْرِبُ، نَحْنُ نَضْرِبُ\nحالت نصب میں: لَنْ یَّضْرِبَ، لَنْ تَضْرِبَ، لَنْ تَضْرِبَ،لَنْ اَضْرِبَ ، لَنْ نَضْرِبَ\nحالت جزم میں: لَمْ  یَضْرِبْ، لَمْ  تَضْرِبْ، لَمْ تَضْرِبْ،لَمْ اَضْرِبْ، لَمْ نَضْرِبْ"}, {"id": "c12t3", "title": "معتل واوی اور یائی", "content": "معتل واوی اور یائی: معتل واوی اس  کلمے کو کہتے ہیں جس کے آخر میں واؤ ہو جیسے یَغْزُوْ، معتل یائی اس  کلمے کو کہتے ہیں جس کے آخر میں یاء ہو جیسے یَرْمِیْ\n٭ رفع اس کا ساتھ تقدیر ضمے کے، نصب ساتھ فتح لفظی کے اور جزم ساتھ حذف لام کے ہوتی ہے \nحالت رفع میں: ھُوَ یَغْزُوْ، اَنْتَ تَغْزُوْ، اَنْتِ تَغْزُوْ، اَنَا اَغْزُوْ، نَحْنُ نَغْزُوْ\nحالت نصب میں: لَنْ یَّغْزُوَ، لَنْ تَغْزُوَ، لَنْ تَغْزُوَ،لَنْ اَغْزُوَ ، لَنْ نَغْزُوَ\nحالت جزم میں: لَمْ  یَغْزُ، لَمْ  تَغْزُ، لَمْ تَغْزُ،لَمْ اَغْزُ، لَمْ نَغْزُ"}, {"id": "c12t4", "title": "مفرد معتل الفی", "content": "مفرد معتل الفی :مفردکا معنی تثنیہ یا جمع نا ہو اور اس  کےآخرمیں میں الف ہو جیسے یَرْضیٰ\n٭ رفع اس کا ساتھ تقدیر ضمے کے، نصب ساتھ  تقدیر فتح کے اور جزم ساتھ حذف لام کے ہوتی ہے\nحالت رفع میں: ھُوَ یَرْضیٰ، اَنْتَ تَرْضیٰ ، اَنْتِ تَرْضیٰ ، اَنَا اَ رْضیٰ ، نَحْنُ نَرْضیٰ\nحالت نصب میں: لَنْ یَّرْضیٰ، لَنْ تَرْضیٰ ، لَنْ تَرْضیٰ،لَنْ اَ رْضیٰ ، لَنْ نَرْضیٰ،\nحالت جزم میں: لَمْ  یَرْضَ، لَمْ  تَرْضَ، لَمْ تَرْضَ،لَمْ اَرْضَ، لَمْ نَرْضَ"}, {"id": "c12t5", "title": "صحیح یا معتل ساتھ ضمیروں اور نونات …", "content": "صحیح یا معتل ساتھ ضمیروں اور نونات مذکورہ کے \n٭ رفع ان کا ساتھ ثابت رکھنے نون کے، اور نصب اور جزم ساتھ حذف نون کے ہوتی ہے\nتثنیہ میں جیسے : ھُمَا یَضْرِبَانِ (   تثنیہ مذکر غائب) ، ھُمَا تَضْرِبَانِ(   تثنیہ موئنث غائب) ، ھُمَا تَضْرِبَانِ (   تثنیہ مذکر مخاطب) ، ھُمَا تَضْرِبَانِ(   تثنیہ موئنث مخاطب)\n ھُمَا یَغْزُوَانِ(   تثنیہ مذکر غائب) ، ھُمَا تَغْزُوَانِ (   تثنیہ موئنث غائب) ، ھُمَا تَغْزُوَانِ (   تثنیہ مذکر مخاطب) ، ھُمَا تَغْزُوَانِ (   تثنیہ موئنث مخاطب)\nھُمَا یَرْمِیَانِ (   تثنیہ مذکر غائب) ، ھُمَا تَرْمِیَانِ  (   تثنیہ موئنث غائب) ، ھُمَا تَرْمِیَانِ (   تثنیہ مذکر مخاطب)  ، ھُمَا تَرْمِیَانِ (   تثنیہ موئنث مخاطب)\n ھُمَا یَرْضَیَانَ (   تثنیہ مذکر غائب)  ، ھُمَاتَرْضَیَانَ (   تثنیہ موئنث غائب)  ، ھُمَاتَرْضَیَانَ (   تثنیہ مذکر مخاطب) ، ھُمَاتَرْضَیَانَ (   تثنیہ موئنث مخاطب)\nجمع  میں مذکر جیسے: ھُمْ یَضْرِبُوْنَ (جمع  مذکر غائب)  ، ھُمْ تَضْرِبُوْنَ (جمع  مذکرمخاطب)  \nھُمْ یَغْزُوْنَ (جمع  مذکر غائب)  ،  ھُمْ تَغْزُوْنَ (جمع  مذکرمخاطب)  \nھُمْ یَرْمُوْنَ (جمع  مذکر غائب)  ، ھُمْ تَرْمُوْنَ (جمع  مذکرمخاطب)  \n ھُمْ یَرْضَوْنَ (جمع  مذکر غائب)   ، ھُمْ تَرْضَوْنَ(جمع  مذکرمخاطب)  \n واحد موئنث مخاطب میں  جیسے  :   اَنْتِ  تَضْرِبِیْنَ،    اَنْتِ   تَغْزِیْنَ،    اَنْتِ   تَرْمِیْنَ،   اَنْتِ  تَرْضَیْنَ\nنصب اور جر ساتھ حذف لام کے \nتثنیہ میں  : لَنْ یَّضْرِبَا(   تثنیہ مذکر غائب) ، لَنْ تَضْرِبَا(   تثنیہ موئنث غائب) ، لَنْ تَضْرِبَا (   تثنیہ مذکر مخاطب) ، لَنْ تَضْرِبَا (   تثنیہ موئنث مخاطب)\n لَنْ یَّغْزُوَا(   تثنیہ مذکر غائب) ، لَنْ تَغْزُوَا(   تثنیہ موئنث غائب) ، لَنْ تَغْزُوَا (   تثنیہ مذکر مخاطب) ، لَنْ تَغْزُوَا (   تثنیہ موئنث مخاطب)\n لَنْ یَّرْمِیَا(   تثنیہ مذکر غائب) ، لَنْ تَرْمِیَا(   تثنیہ موئنث غائب) ، لَنْ تَرْمِیَا (   تثنیہ مذکر مخاطب) ، لَنْ تَرْمِیَا (   تثنیہ موئنث مخاطب)\n لَنْ یَّرْضَیَا(   تثنیہ مذکر غائب) ، لَنْ تَرْضَیَا(   تثنیہ موئنث غائب) ، لَنْ تَرْضَیَا (   تثنیہ مذکر مخاطب) ، لَنْ تَرْضَیَا (   تثنیہ موئنث مخاطب)\n لَمْ یَضْرِبَا(   تثنیہ مذکر غائب) ، لَمْ تَضْرِبَا(   تثنیہ موئنث غائب) ، لَمْ تَضْرِبَا (   تثنیہ مذکر مخاطب) ، لَمْ تَضْرِبَا(   تثنیہ موئنث مخاطب)\nلَمْ یَغْزُوَا(   تثنیہ مذکر غائب) ، لَمْ تَغْزُوَا(   تثنیہ موئنث غائب) ، لَمْ تَغْزُوَا (   تثنیہ مذکر مخاطب) ، لَمْ تَغْزُوَا(   تثنیہ موئنث مخاطب)\nلَمْ یَرْمِیَا(   تثنیہ مذکر غائب) ، لَمْ تَرْمِیَا(   تثنیہ موئنث غائب) ،  لَمْ تَرْمِیَا (   تثنیہ مذکر مخاطب) ،  لَمْ تَرْمِیَا (   تثنیہ موئنث مخاطب)\nلَمْ یَرْضَیَا(   تثنیہ مذکر غائب)  ، لَمْ یَرْضَیَا(   تثنیہ موئنث غائب) ، لَمْ یَرْضَیَا (   تثنیہ مذکر مخاطب) ، لَمْ یَرْضَیَا (   تثنیہ موئنث مخاطب)\nجمع مذکر : لَنْ یَّضْرِبُوْ (جمع  مذکر غائب)  ، لَنْ تَضْرِبُوْ(جمع  مذکرمخاطب)  \n لَنْ یَّغْزُوْ (جمع  مذکر غائب)  ، لَنْ تَغْزُوْ(جمع  مذکرمخاطب)  \n لَنْ یَّرْمُوْ (جمع  مذکر غائب)  ، لَنْ تَرْمُوْ (جمع  مذکرمخاطب)  \n لَنْ یَّرْضَوْ (جمع  مذکر غائب)  ، لَنْ تَرْضَوْ (جمع  مذکرمخاطب)  \n لَمْ یَضْرِبُو (جمع  مذکر غائب)  ، لَمْ تَضْرِبُو (جمع  مذکرمخاطب)  \n لَمْ یَغْزُوْا (جمع  مذکر غائب)  ، لَمْ تَغْزُوْا (جمع  مذکرمخاطب)  \n لَمْ یَرْمُوْ (جمع  مذکر غائب)  ، لَمْ تَرْمُوْ (جمع  مذکرمخاطب)  \n لَمْ یَرْضَوْ (جمع  مذکر غائب)   ، لَمْ تَرْضَوْ(جمع  مذکرمخاطب)  \nواحد موئنث مخاطب میں جیسے :   لَنْ  تَضْرِبِیْ،    لَنْ   تَغْزِیْ،    لَنْ   تَرْمِیْ،   لَنْ  تَرْضَیْ، لَمْ تَضْرِبِیْ، لَمْ تَغْزِیْ، لَمْ تَرْمِیْ،   لَمْ تَرْضَیْ"}]}, {"id": "c13", "title": "عوامل اعراب کے بیان میں", "topics": [{"id": "c13t0", "title": "جان تو جو عوامل(عمل کرنے والے) اعرا…", "content": "جان تو جو عوامل(عمل کرنے والے) اعراب دو قسم پر ہیں\t\t1.لفظی\t\t2.معنوی\n\nلفظی تین قسم پر ہے \t1.حروف\t2.افعال \t\t3.اسماء"}, {"id": "c13t1", "title": "اور ان کوہم  تین ابواب میں ذکر کریں…", "content": "اور ان کوہم  تین ابواب میں ذکر کریں گے  ان شاء اللہ تعالیٰ"}, {"id": "c13t2", "title": "پہلی فصل حروف عاملہ میں اور وہ 5 قس…", "content": "پہلی فصل حروف عاملہ میں اور وہ 5 قسم پر ہے"}, {"id": "c13t3", "title": "حرف جر", "content": "حرف جر: پہلی قسم حروف  عاملہ کی حروف جارہ ہیں اور وہ سترہ (17) ہیں \t1.بَا\t2.مِنْ           3.اِلیٰ        4.حَتّیٰ        5. فِیْ      6.لَامْ       7.رُبَّ         8.واؤ قسم   9.تاء قسم    10.عَنْ      11.عَلیٰ\t12.کاف تشبیہ    13.  مُذْ        14.مُنْذُ          15.حَاشَا              16.خَلَا\t17.عَدَا \n٭ یہ حروف اسم میں داخل ہوتے ہیں اور اسکے آخر کو جر دیتے ہیں ہیں جیسے كَتَبَ بِالْقَلَمِ،خَرَجَ زَيْدٌ مِنَ الْبَيْتِ، ذَهَبَ إِلَى السُّوقِ، سَارُوا حَتَّى الْبَلَدِ، فِیْ الْاَرْضِ، اجْتَهِدْ لِتَفُوزَ، وَاللَّهِ لَأَفْعَلَنَّ، تَاللَّهِ لَأُكْرِمَنَّكَ، سَأَلَ عَنْ الْحَقِيقَةِ، صَعِدَ عَلَى الْجَبَلِ، كَالْأَسَدِ فِي الشَّجَاعَةِ، مُذْ یَوْ مَ الْجُمُعَۃِ، هُوَ مُسَافِرٌ مُنْذُ أُسْبُوعٍ، حَضَرَ الْقَوْمُ حَاشَا زَيْدٍ، جَاءَ النَّاسُ خَلَا زَيْدٍ، مَرَرْتُ بِالْقَوْمِ عَدَا رَجُلٍ"}, {"id": "c13t4", "title": "حروف مشبہ بالفعل", "content": "حروف مشبہ بالفعل:  چھ (6) حروف مشبہ بالفعل ہیں اِنَّ، اَنَّ، کَاَنَّ، لَیْتَ، لٰکِنَّ ، لَعَلَّ \n٭ یہ حروف اسم کو نصب اور خبر کو رفع دیتے ہیں جیسے اِنَّ زَیْدًا قَائِمٌ ، زَیْدًا کو اسم اِنَّ کا کہتے ہیں اور قَائِمٌ کو خبر اِنَّ کی کہتے ہیں\nجان تو جو اِنَّ، اَنَّ حرف تحقیق (کسی چیز کو ثابت کرنے کیلئے )کا ہے  ، کَاَنَّ  حرف تشبیہ ( ایک چیز کو دوسری چیز میں کسی وصف کی بنا پر شریک کرنا) کا ہے ، لٰکِنَّ حرف استدراک (گذشتہ کلام سے پیدا ہونے والے وہم کو دور کرنا) کا ہے، لَیْتَ حرف تمنی (جس کے ذریعے کسی کام کی آرزو یا خواہش ظاہر کی جائے) کا ہے، لَعَلَّ حرف ترجی (جس کے ذریعے کسی کام کی  امید کی جائے) کا ہے ۔"}, {"id": "c13t5", "title": "ما اور لا مشبہ بلیس", "content": "ما اور لا مشبہ بلیس: یعنی وہ حروف جو عمل کرنے میں لَیْسَ کے ساتھ مشابہت رکھتے ہیں  جیسے  مَا زَیْدٌ قَائِمًا، زَیْدٌ اسم مَا کا ہےاور قَائِمًا خبر مَا کی ہے"}, {"id": "c13t6", "title": "لائی نفی جنس", "content": "لائی نفی جنس:  وہ ہے جو  خبر سے جنسِ اسم کے تمام افراد کی نفی کرتا ہے جیسے \n٭ اسم اس لَا کا اکثر مضاف ہوتا  ہے منصوب ، اور خبر اسکی مرفوع جیسے لَا غُلَامَ رَجُلٍ ظَرِیْفٌ فِی الدَّارِ  ) گھر میں کسی بھی آدمی کا کوئی عقل مند غلام نہیں ہے) ، اور اگر نکرہ مفرد ہوتو مبنی بر فتح ہوگا  جیسے لَا رَجُلَ فِی الدَّارِ   ) نہیں ہے کوئی مرد گھر میں)، اور اگر بعد اس کے معرفہ ہوتکرار لَا کی دوسرے معرفہ کے ساتھ لازم ہوگی اور دوسرا لَا لغو ہوگا یعنی عمل نہیں کرے گا اور معرفہ مرفوع ہوگا  مبتداء ہونے کی وجہ سے جیسے لَازَیْدٌ عِنْدِیْ وَلَا عَمْرٌ و، اور اگر بعد اس \"لَا\" کےنکرہ مفرد ہو مکرر(تکرار کیا ہوا )ساتھ نکرے دوسرے کے، اس میں پانچ (5) وجہ پڑھنی جائزہیں  جیسے"}, {"id": "c13t7", "title": "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِا…", "content": "لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ\n٭اس مثال میں\" لَا \"نفی جنس کا ہے ، اس کے بعد نکرہ مفردہ واقع ہے اور \"لَا \"کی تکرار دوسرے نکرہ مفردہ\" قُوَۃَ\"  سے ہےاور دونوں نکرہ مبنی بر فتح ہیں"}, {"id": "c13t8", "title": "لَا حَوْلٌ وَلَا قُوَّةٌ إِلَّا بِا…", "content": "لَا حَوْلٌ وَلَا قُوَّةٌ إِلَّا بِاللَّهِ\n٭اس مثال میں  \" لَا \" نفی جنس کا ہے اور عمل نہیں کر رہا اور دوسرا \" لَا \" زائدہ ہے نفی کی تاکید کے لئے (نفی کو پکا کرنے کے لئے) دونوں نکرہ مبتداء ہونے کی وجہ سے مرفوع ہیں"}, {"id": "c13t9", "title": "لَا حَوْلَ وَلَا قُوَّةٌ إِلَّا بِا…", "content": "لَا حَوْلَ وَلَا قُوَّةٌ إِلَّا بِاللَّهِ\n٭ پہلا \" لَا \" نفی جنس کا ہے جو \"حَوْلَ\" کو نصب دے رہا ہے اور دوسرا  \" لَا \" زائدہ ہے نفی کی تاکید کے لئے (نفی کو پکا کرنے کے لئے)، پہلا نکرہ حَوْلَ مبنی بر فتح ہے اور دوسرا نکرہ\" قُوَّۃٌ\" مبتداء ہونے کی وجہ سے مرفوع ہے"}, {"id": "c13t10", "title": "لَا حَوْلٌ وَلَا قُوَّةَ إِلَّا بِا…", "content": "لَا حَوْلٌ وَلَا قُوَّةَ إِلَّا بِاللَّهِ\n٭ پہلا \"لَا\" مشبہ بلیس ہے   (جیسا کہ لَیْسَ کا اسم مرفوع ہوتا ہے اور خبر منصوب ہوتی ہے) ، حَوْلٌ \"لَا\" کا اسم ہے اس لئے مرفوع ہے اور دوسرا \"لَا\" نفی جنس کا ہے اور\"قُوَّۃَ\" اسم ہے \"لَا\" نفی جنس کا اس لئے منصوب ہے۔ (\"لَا\"نفی  جنس کا اسم منصوب  ہوتا ہے)"}, {"id": "c13t11", "title": "لَا حَوْلَ وَلَا قُوَّةً إِلَّا بِا…", "content": "لَا حَوْلَ وَلَا قُوَّةً إِلَّا بِاللَّهِ\n٭ پہلا \" لَا \" نفی جنس کا ہے جو\" حَوْلَ \"کو نصب دے رہا ہے اور دوسرا  \" لَا \" زائدہ ہے نفی کی تاکید کے لئے (نفی کو پکا کرنے کے لئے)،\" قُوَّةً \"نکرہ ہے منصوب تنوین کے ساتھ"}, {"id": "c13t12", "title": "حروف نداء", "content": "حروف نداء: پانچ حرو ف نداءکےہیں \t1.یَا       2. اَیَا    3. ھَیَا       4.اَیْ                                                                               5. ہمزہ مفتوحہ\n٭ یہ حروف منادیٰ مضاف کو نصب دیتے ہیں  جیسے یَا عَبْدَاللہِ (عبد منادیٰ مضاف ہے اس لئے منصوب ہے) ، مشابہ مضاف  (جس کا معنی مضاف الیہ کے ملائے بغیر پورا نا ہو)کو بھی یہ حروف  نصب دیتے ہیں جیسے   یَا طَالِعًا جَبَلًا ( اے پہاڑ پر چڑھنے والا )،  یَا طَالِعًا (اے چڑھنے والا) کہا تو معنی سمجھ نہیں آیا  کہ کس پر چڑھنے والا اب یہاں احتیاج مضاف الیہ کی ہوگی،مضاف الیہ کے ملائے بغیر معنی مکمل نہیں ہوگا  تو کہنا پڑے گا  یَا طَالِعًا جَبَلًا ( اے پہاڑ پر چڑھنے والا )   اب معنی مکمل ہوا۔ یہ حروف نکرہ غیر معین  کو بھی نصب دیتے ہیں  جیسے کہ کوئی اندھا کہے یَا رَجُلًا خُذْ بِیَدِیْ ( اے  کوئی مرد پکڑ ہاتھ میرا) ۔ اور منادیٰ مفردمعرفہ(مفرد یعنی مضاف ، مشابہ مضاف اور جملہ نا ہو)   مبنی بر علامت رفع ہوتا ہے  جیسے \nیَا زَیْدُ ، یَازَیْدَانِ ، یَا مُسْلِمُوْنَ، یَا مُوْسیٰ، یَا قَاضِیْ \n٭جان تو اَیْ  اور ہمزہ مفتوحہ منادیٰ (وہ اسم ظاہر جس کی توجہ حروف نداء کے ذریعے طلب کی جائے ) واسطے قریب   کے ہے ، اَیَا اور ھَیَا  منادیٰ واسطےدور کے ہے ، اور یَا منادیٰ عام(دور و نزدیک  کے لئے ) ہے\n٭ یہاں پر دیابنہ کا ایک اور اعتراض باطل ہوگیا کہ تم لوگ یہاں سے یَارَسُوْلَ اللہ پکارتے ہو ، حضور ﷺکی مزار شریف   ہزاروں میل کے فاصلے   پر ہے تو یہاں سےیَا کے ساتھ  نداء کرنا  درست نہیں ہوگا ، مصنف نحو میر  نے مسئلہ حل فرما دیا کہ حضورﷺ چاہے دور ہوں یا نزدیک ان کو یَا رَسُوْلَ اللہ سے نداء کر سکتے ہیں۔(اگرچہ فقیر حضور ﷺکو دور نہیں مانتا)"}, {"id": "c13t13", "title": "دوسری  فصل فعل مضارع میں عمل کرنے و…", "content": "دوسری  فصل فعل مضارع میں عمل کرنے والے حروف میں ،اس کو دوقسمیں ہیں"}, {"id": "c13t14", "title": "فعل مضارع کو نصب دینے والے حروف", "content": "فعل مضارع کو نصب دینے والے حروف: وہ حروف جو فعل مضارع کو نصب دیتے ہیں  چار (4) ہیں ،جو مندرجہ ذیل ہیں"}, {"id": "c13t15", "title": "اَنْ", "content": "اَنْ: جیسے اُرِیْدُ اَنْ تَقُوْمَ ، اَنْ فعل مضارع کے ساتھ مصدر کے معنی میں ہوگا یعنی اُرِیْدُ قِیَامَکَ  اور اسی وجہ سے اس کو اَنْ مصدریہ بھی کہتے ہیں \n٭ اَنْ مصدریہ  وہ اَنْ ہوتا ہے جو فعل مضارع پر داخل ہوکر اس کو  مصدر کے معنی میں کردیتا ہے اور پھر مصدر کو اُس  (فعل مضارع ) کی ضمیر کی طرف مضاف بنا دیتا ہے"}, {"id": "c13t16", "title": "لَنْ", "content": "لَنْ:جیسے لَنْ یَّخْرُجَ زَیْدٌ ، لَنْ واسطے نفی تاکید کے لئے ہوتا ہےاور دوسرا لَنْ ناصبہ ہوتا ہے جو فعل مضارع کو نصب دیتا ہے"}, {"id": "c13t17", "title": "کَیْ", "content": "کَیْ : جیسے اَسْلَمْتُ کَیْ اَدْخُلَ الْجَنَّۃَ (اسلام لیا میں تا کہ داخل ہوجاؤں میں جنت میں)"}, {"id": "c13t18", "title": "اِذَنْ", "content": "اِذَنْ : جیسے اِذَنْ اُکْرِمَکَ (تب میں تیری عزت کروں گا) اس شخص کے جواب میں جو کہے اَنَا اَتِیْکَ غَدًا (میں کل تیرے پاس آؤں گا)"}, {"id": "c13t19", "title": "جان تو جو اَنْ چھ (6) حروف کے بعد چ…", "content": "جان تو جو اَنْ چھ (6) حروف کے بعد چھپا ہوا ہوتا ہے اور فعل مضارع کو نصب دیتا ہے  ۔ وہ چھ(6) حروف مندرجہ ذیل ہیں:"}, {"id": "c13t20", "title": "حَتّٰی", "content": "حَتّٰی :   جیسے مَرَرْتُ حَتّٰی اَدْخُلَ الْبَلَدَ (میں گذرا یہاں تک کہ شہر میں داخل ہوگیا ) ،حَتّٰی کے بعد اَنْ مقدر (چھپا ہوا ) ہے جو اَدْخُلَ فعل کو نصب دے رہا ہے ، اور نصب اَدْخُلَ کی لام پر ظاہر ہو رہی ہے"}, {"id": "c13t21", "title": "لام جحد", "content": "لام جحد: جیسے مَا کَانَ اللہُ لِیُعَذِّ بَھُم (اور اللہ کا کام نہیں کہ انہیں عذاب کرے جب تک کہ اے محبوب تم ان میں تشریف فرما ہو )۔ لام جحد کے بعد اَنْ مقدر (چھپا ہوا ) ہے جو کہ  یُعَذِّ بَ کو نصب دے رہا ہے اور نصب یُعَذِّبَ کی با پر ظاہر ہورہی ہے۔"}, {"id": "c13t22", "title": "اَوْ ساتھ معنی  اِلیٰ اَنْ (یہاں تک…", "content": "اَوْ ساتھ معنی  اِلیٰ اَنْ (یہاں تک کہ) کے یا اِلَّا اَنْ (مگر یہ کہ) کے:  جیسے لَاَ الْزَمَنَّکَ اَوْ تُعْطِیَنِیْ حَقِّی (بےشک میں ضرور بالضرور تیرے پیچھے لگا رہوں گا ، یہاں تک کہ تو میرا حق مجھے دے دے ) ، اَوْ کے بعد اَنْ مقدر (چھپا ہوا) ہے جو  تُعْطِیَ کو نصب دے  رہا اور نصب  تُعْطِیَ کی یاء پر ظاہر ہو رہی ہے"}, {"id": "c13t23", "title": "واؤ صرف", "content": "واؤ صرف : واؤ صرف کی وہ واؤ ہوتی ہے عاطفہ جو معطوف علیہ پر داخل ہونے والی چیز کو معطوف پر داخل ہونے سےروکے جیسے لَاتَأْ کُلِ السَّمَکَ وَ تَشْرَبَ الَّبَنَ( مچھلی کھانے کے ساتھ دودھ نا پیو)لَا نافیہ اور واؤ صرف کی لَا کو واؤ پر داخل ہونے سے  روکتی ہے  ، واؤ صرف  کے بعد اَنْ  مقدر ہے جس نے تَشْرَبَ کو نصب دیا اور نصب تَشْرَبَ کی با پر ظاہر ہو رہی ہے"}, {"id": "c13t24", "title": "لام کَیْ", "content": "لام کَیْ: جیسے اَسْلَمْتُ لِاَدْخُلَ الْجَنَّۃَ لام کَی کے بعد اَنْ مقدر ہے جس نے اَدْخُلَ کو نصب دیا اور نصب اَدْخُلَ کے لام پر ظاہر ہورہی ہے"}, {"id": "c13t25", "title": "فاءجو چھ(6) چیزوں کے جواب میں ہو  ت…", "content": "فاءجو چھ(6) چیزوں کے جواب میں ہو  تو اس کے بعد بھی اَنْ مقدر ہوگا:"}, {"id": "c13t26", "title": "امر", "content": "امر : جیسے زُرْنِیْ فَاُ کْرِمُکَ   (مجھے ملنے آؤ، میں تمہاری عزت کروں گا)"}, {"id": "c13t27", "title": "نہی", "content": "نہی: جیسے  لَاتُشْتِمْنِی فَاُذِیْنَکَ  (مجھے گالی نہ دو، ورنہ میں تمہیں تکلیف دوں گا)"}, {"id": "c13t28", "title": "نفی", "content": "نفی: جیسے مَاتَاتِیْنَا فَتُحَدِّثَنَا(تم ہمارے پاس کیوں نہیں آتے تاکہ ہمیں کوئی بات سناؤ)"}, {"id": "c13t29", "title": "استفہام", "content": "استفہام : جیسے اَیْنَ بَیْتُکَ فَاَزُوْرَکَ   (تمہارا گھر کہاں ہے تاکہ میں تم سے ملنے آؤں؟)"}, {"id": "c13t30", "title": "تمنی", "content": "تمنی : جیسے لَیْتَ لِیْ مَالًا فَاُنْفِقَ مِنْہُ  (کاش میرے پاس مال ہوتا تاکہ میں اسے خرچ کرتا)"}, {"id": "c13t31", "title": "عرض", "content": "عرض:جیسے اَلَاتَنْزِلُ بِنَا فَتُصِبَ خَیْرًا  (کیا تم ہمارے ہاں قیام نہیں کرتے تاکہ تم بھلائی پاؤ؟)"}, {"id": "c13t32", "title": "جازم فعل مضارع", "content": "جازم فعل مضارع :  وہ حروف جو فعل کوجزم دیتے ہیں وہ پانچ ہیں \t1.لَمْ     2. لَمَّا\t3.لام امر      4.لَا نہی    5. اِنْ شرطیہ"}, {"id": "c13t33", "title": "لَم", "content": "لَم: یہ فعل مضارع کو جزم دیتا ہے جیسے لَمْ یَنْصُرْ ، جو اصل میں  یَنْصُرُ تھا جب لَمْ  فعل مضارع پر داخل ہوا تو لَمْ یَنْصُرْ   ہوگیا جزم یَنْصُرْ    کی \"را\" پر ظاہر ہورہی ہے"}, {"id": "c13t34", "title": "لَمَّا", "content": "لَمَّا : یہ بھی فعل مضارع کو جزم دیتا ہے جیسے لَمَّا  ْ یَنْصُرْ ، جو اصل میں  یَنْصُرُ تھا جب لَم  فعل مضارع پر داخل ہوا تو لَمَّا یَنْصُرْ   ہوگیا جزم  ْ    یَنْصُرْ    کی \"را\" پر ظاہر ہورہی ہے"}, {"id": "c13t35", "title": "لام امر", "content": "لام امر:  یہ بھی فعل مضارع کو جزم دیتا ہے جیسے لِیَنْصُرْ ، جو اصل میں  یَنْصُرُ تھا جب لام امر  فعل مضارع پر داخل ہوا  تو لِیَنْصُرْ ہوگیا  جزم  یَنْصُرْ    کی \"را\" پر ظاہر ہورہی ہے"}, {"id": "c13t36", "title": "لَا نہی", "content": "لَا نہی :  یہ بھی فعل مضارع کو جزم دیتا ہے جیسے  لَا یَنْصُرْ ، جو اصل میں  یَنْصُرُ تھا جب لَا نہی کا فعل  مضارع پر داخل ہوا  تو  لَا یَنْصُرْ ہوگیا  جزم  یَنْصُرْ    کی \"را\" پر ظاہر ہورہی ہے"}, {"id": "c13t37", "title": "اِنْ شرطیہ", "content": "اِنْ شرطیہ :  یہ بھی فعل مضارع کو جزم دیتا ہے جیسے   اِنْ تَنْصُرْ اَنْصُرْ،  جو اصل میں  یَنْصُرُ اَنْصُرُ تھا جب اِنْ شرطیہ  فعل مضارع پر داخل ہوا  تو اِنْ تَنْصُرْ اَنْصُرْ جزم      یَنْصُرْ    کی \"را\" پر ظاہر ہورہی ہے\n٭ جان تو جو اِنْ دو جملوں میں جاتا ہے جیسے ، جملے پہلے کو شرط کہتے ہیں اور جملے دوسرے کو جزا اور اِنْ واسطے مستقبل کے ہے اگر چہ ماضی میں داخل ہو جیسے اِنْ ضَرَبْتَ ضَرَبْتُ  ، اس جگہ جزم تقدیری ہے کیوں کہ ماضی مبنی  ہے  ( وَالْمَبْنِیُّ مَا لَا  یَتَغَیَّرُ اٰخِرُہٗ بِدَخُوْلِ الْعَوَ امِلِ الْمُخْتَلِفَۃِ عَلَیْہِ)"}, {"id": "c13t38", "title": "٭ جان تو جو جب جزا شرط کی جملہ اسمی…", "content": "٭ جان تو جو جب جزا شرط کی جملہ اسمیہ ہو تو \"فاء \"کو جواب میں لانا واجب ہوگاجیسے  کہ"}, {"id": "c13t39", "title": "اِنْ تَأْتِنِیْ فَاَنْتَ مُکْرَمٌ  …", "content": "اِنْ تَأْتِنِیْ فَاَنْتَ مُکْرَمٌ   ( اگر تو میرے پاس آئے گا تو تیری عزت کی جائے گی )"}, {"id": "c13t40", "title": "اِنْ رَأَیْتَ زَیْدًا فَاَکْرِمْہُ …", "content": "اِنْ رَأَیْتَ زَیْدًا فَاَکْرِمْہُ  ( اگر تو زید کو دیکھے تو اس کی عزت کرنا)"}, {"id": "c13t41", "title": "اِنْ اَتَا کَ عَمْرٌو فَلَا تُھِنْہ…", "content": "اِنْ اَتَا کَ عَمْرٌو فَلَا تُھِنْہُ ( اگر تیرے پاس عمرو آئے تو اسکی توہین نا کرنا)"}, {"id": "c13t42", "title": "اِنْ اَکْرَ مْتَنِیْ فَجَزَاکَ اللہ…", "content": "اِنْ اَکْرَ مْتَنِیْ فَجَزَاکَ اللہُ خَیْرًا ( اگر تو میری عزت کرے تو اللہ تجھے جزائے خیر دے)"}, {"id": "c13t43", "title": "جان تو جو کوئی فعل غیر عامل (عمل نا…", "content": "جان تو جو کوئی فعل غیر عامل (عمل نا کرنے والا) نہیں ہے اور افعال عمل کرنے میں دو قسم پر ہیں"}, {"id": "c13t44", "title": "1.معروف \t\t2.  مجہول", "content": "1.معروف \t\t2.  مجہول"}, {"id": "c13t45", "title": "معروف", "content": "معروف: فعل معروف چاہے لازم  (جو فعل معنی مکمل کرنے میں مفعول کا محتاج نا ہو) ہو یا متعدی  (جو فعل معنی مکمل کرنے میں مفعول کا محتاج  ہو) فاعل کو رفع دیتا ہے  جیسے قَامَ زَیْدٌ  (کھڑا ہوا زید) اور ضَرَبَ عَمْرٌو (مارا عمرو نے ) اور چھ (6)  اسم کو نصب دیتا ہے"}, {"id": "c13t46", "title": "مفعول مطلق", "content": "مفعول مطلق: وہ اسم  مصدر ہے منصوب  جو واقع ہو بعد کسی فعل کے اوروہ  مصدر ساتھ معنی فعلِ سابق  کے ہو جیسے ضَرَبَ زَیْدٌ ضَرْبًا ،قَامَ زَیْدٌ قِیَامًا \n٭ ضَرْبًا اور قِیَامًا اسم مصدر مفعول مطلق ہیں اور فعل  سابق یعنی ضَرَبَ اور قَامَ کے معنی کے ساتھ ہے\n٭ قَامَ زَیْدٌ قِیَامًا  (کھڑا ہوا زید کھڑا ہونا )، قَامَ فعل لازم نے زَیْدٌ کو رفع اور مفعول مطلق کو نصب دیا اور ضَرَبَ زَیْدٌ ضَرْبًا (مارا زید نے مارنا) ، ضَرَبَ فعل متعدی نے ضَرْبًا مفعول مطلق کو نصب دیا"}, {"id": "c13t47", "title": "مفعول فیہ", "content": "مفعول فیہ: وہ اسم  زمان یا مکان ہے منصوب جو فعل مذکور  اس میں واقع ہو\n٭ جیسے  فعل لازم کی مثال ہے کہ صُمْتُ یَوْمَ الْجُمُعَۃِ  (میں نے جمعہ کے دن روزہ رکھا )   صُمْتُ فعل مذکور ہے اور   یَوْمَ الْجُمُعَۃِ    مفعول فیہ (اسم زمان) ہے ، اس مثال پر مفعول فیہ کی تعریف  صادق آرہی ہے ،  صُمْتُ فعل نے  یَوْمَ الْجُمُعَۃِ   مفعول فیہ کو نصب دیا\n٭ فعل متعدی کی مثال جیسے جَلَسْتُ فَوْقَکَ ( میں تیرے اوپر بیٹھا)  جَلَسْتُ فعل مذکور ہے اور   فَوْقَکَ مفعول فیہ (اسم مکان )  ہے ، اس مثال پر مفعول فیہ کی تعریف صادق آرہی ہے ، جَلَسْتُ فعل نے  فَوْقَکَ مفعول فیہ کو نصب دیا"}, {"id": "c13t48", "title": "مفعول معہ", "content": "مفعول معہ : وہ اسم ہے منصوب جو ایسی واؤ کے بعد واقع ہو جو واؤ مع کے معنی کے ساتھ ہو  جیسے جَاءَ الْبَرْدُ وَالْجُبَاتِ (آگئی سردیاں ساتھ کوٹوں کے ) \n٭  جَاءَ فعل ہے،  الْبَرْدُ فاعل ہے ،واؤ مع کے معنی کے ساتھ اور  الْجُبَاتِ مفعول معہ ہے \n٭ جَاءَ فعل نے  الْبَرْدُ فاعل کو رفع دیا اور  الْجُبَاتِ مفعول معہ کو نصب دیا (کیوں کہ الْجُبَاتِ جمع موئنث سالم ہے اس لئے اس کا  نصب کسرے کے ساتھ ہے)"}, {"id": "c13t49", "title": "مفعول لہٗ", "content": "مفعول لہٗ: وہ اسم ہے منصوب جو دلالت کرے اس چیز پر جو سبب فعلِ سابق کا ہو\n٭ جیسے قُمْتُ اِکْرَامًا لِزَیْدٍ ( میں زید کی عزت کے لئے کھڑا ہوا ) ، اِکْرَامًا مفعول لہٗ ہے جس سے فعل سابق (قُمْتُ) کا سبب واضح ہورہا ہے \n٭ ضَرَبْتُہٗ تَادِیْبًا ( میں نے اسکو ادب سکھانے کے لئے مارا) ، تَادِیْبًا  مفعول لہٗ ہے جس سے فعل سابق (ضَرَبْتُہٗ) کا سبب واضح ہورہا ہے"}, {"id": "c13t50", "title": "حال", "content": "حال: وہ اسم نکرہ ہوتا ہے منصوب جو فاعل یا مفعول بہٖ یا پھر دونوں کی حالت کو بیان کرے\n٭  فاعل کی حالت کو جیسے جَاءَ زَیْدٌ رَاکِبًا ( آیا زید در آں حالیکہ سوار تھا) ، رَاکِبًا حال ہے کیوں کہ   زَیْدٌ (فاعل)  کی حالت کو بیان کررہا ہے\n٭ مفعول بہٖ کی حالت کو  جیسے  ضَرَبْتُ زَیْدًا مَشْدُوْدًا ( مارا میں زید کو در آں حال کہ وہ بندھا ہوا تھا) ، مَشْدُوْدًا حال ہے زَیْدًامفعول بہٖ  کی حالت کو بیان کررہا ہے\n٭ فاعل اور مفعول بہٖ دونوں کی حالت کو جیسے لَقِیْتُ زَیْدًا رَاکِبَیْنِ ( ملا میں زید کو در آں حالیکہ ہم دونوں سوار تھے)  ، فاعل اور مفعول بہٖ کو ذوالحال کہتے ہیں اور وہ اکثر معرفہ ہوتا ہے ،اگر نکرہ ہو تو حال کو پہلے لاتے ہیں  جیسے جَاءنِیْ رَاکِبًا رَجُلٌ  (آیا میرے پاس زید در آں حالیکہ وہ سوار تھا) اور حال جملہ بھی ہوتا  ہے جیسے رَأَیْتُ الْاَمِیْرَ وَھُوَ رَاکِبٌ  ( دیکھا میں نے بادشاہ کو اور وہ سوار تھا)"}, {"id": "c13t51", "title": "تمیز", "content": "تمیز :  وہ اسم ہے منصوب جو تعداد، وزن ، پیمانے اور پیمائش میں موجود ابہام کو دور کرے ،اس وقت جو فعل کی فاعل کی طرف نسبت میں کوئی پوشیدگی ہو \n٭ تعداد میں جیسے عِنْدِی اَحَدَ عَشَرَ دِرْھَمًا ( میرے پاس گیارہ درہم ہیں) ، جب کہا عِنْدِی اَحَدَ عَشَرَ (میرے پاس گیارہ ہیں) اب سمجھ نہیں رہی اس کے پاس گیارہ کیا ہیں ٹوپیاں ہیں؟، سوٹ ہیں؟ ، کمبل ہیں؟، اب دِرْھَمًا کہہ دیا تو ابہام دور ہوگیا  کہ اس کے پاس گیارہ درہم ہیں\n٭  وزن میں جیسے عِنْدِیْ رِطْلٌ زَیْتًا( میرے پاس آدھا کلو زیتون کا تیل ہے)\n٭ پیمانے میں جیسے عِنْدِیْ قَفِیْزَانِ بُرًّا (میرے پاس دو بوریاں گندم کی ہیں ) \n٭ پیمائش میں جیسے مَا فِی السَّمَاءِ قَدْرُ رَاحَۃٍ سَحَابًا ( آسمان پر ہتھیلی جتنا بادل بھی نہیں ہے)"}, {"id": "c13t52", "title": "بہر حال فعل متعدی مفعول بہٖ کو نصب …", "content": "بہر حال فعل متعدی مفعول بہٖ کو نصب دیتا ہے جیسے ضَرَبَ زَیْدٌ عَمْرًا  اور یہ عمل فعل لازم کو نہیں ہوتا (کیوں کہ فعل لازم کو مفعول بہٖ کی ضرورت نہیں ہوتی)"}]}, {"id": "c14", "title": "فاعل اور منصوبات جملہ کے بیان میں", "topics": [{"id": "c14t0", "title": "فاعل", "content": "فاعل : وہ اسم ہے جو پہلے اس سے کوئی فعل ہو ،وہ فعل مسند ہو ساتھ اس اسم کے ایسے طریقے پر جو قیام فعل کا ساتھ اس اسم کے ہو \n٭ جیسے ضَرَبَ زَیْدٌ(مارا زید نے)  میں زَیْدٌ اسم ہے  اس سے پہلے فعل ضَرَبَ ہے جو مسند ہے  اور اسم کی وجہ سے قائم ہے"}, {"id": "c14t1", "title": "مفعول بہٖ", "content": "مفعول بہٖ: وہ اسم ہے جو فاعل کا فعل اس پر واقع ہو جیسے ضَرَبَ زَیْدٌ عَمْرًا (مارا زید نے عمرو کو)  ،ضَرَبَ (فعل ) نے  زَیْدٌ (فاعل) کو رفع دیا اورعَمْرًا (مفعول بہٖ) کو نصب دیا۔"}, {"id": "c14t2", "title": "جان تو جوتمام  منصوبات جملہ پورا ہو…", "content": "جان تو جوتمام  منصوبات جملہ پورا ہونے کےبعد  ہوتے ہیں اور  جملہ فعل اور فاعل کے ساتھ پورا ہوتا ہے ، اس وجہ سے کہتے ہیں اَلْمَنْصُوْبُ فَضْلَۃٌ (منصوب زائدہ ہے)"}]}, {"id": "c15", "title": "فاعل کی اقسام کے بیان میں", "topics": [{"id": "c15t0", "title": "جان تو جو فاعل  دو قسم پر ہے \t1. مظ…", "content": "جان تو جو فاعل  دو قسم پر ہے \t1. مظہر  \t\t2.مضمر \t\tفاعل مظہر بھی ہوتا ہے اور مضمر بھی"}, {"id": "c15t1", "title": "مظہر", "content": "مظہر :  اس کو اسم ظاہر بھی کہتے ہیں ، ستر(70) ضمیروں کے علاوہ جتنے بھی اسماء ہیں سب کے سب مظہر ہیں جیسے کتاب،قلم،دوات وغیرہ ، جیسے ضَرَبَ زَیْدٌ (مارا زید نے) ضَرَبَ فعل ہے ، زَیْدٌ فاعل ہے جو کہ اسم ظاہر ہے"}, {"id": "c15t2", "title": "مضمر کی دو اقسام ہیں", "content": "مضمر کی دو اقسام ہیں"}, {"id": "c15t3", "title": "مضمر بارز(ظاہر)", "content": "مضمر بارز(ظاہر) : جیسے ضَرَبْتُ (مارا میں نے) ، تُ ضمیر ظاہر ہے"}, {"id": "c15t4", "title": "مضمر مستتر( پوشیدہ)", "content": "مضمر مستتر( پوشیدہ) : زَیْدٌ ضَرَبَ( مارا زید نے)، فاعل ضَرَبَ کا ھُوَ ہے ضَرَبَ میں چھپا ہوا"}, {"id": "c15t5", "title": "جان تو جو جب فعل کا فاعل موئنث حقیق…", "content": "جان تو جو جب فعل کا فاعل موئنث حقیقی (موئنث حقیقی وہ ہوتی ہے جس کے مقابلے میں حیوان مذکر ہو )ہو یا ضمیر موئنث کی ہو علامت تانیث کی فعل میں لانا لازم ہوگی جیسے قَامَتْ ھِنْدٌ اور ھِنْدٌ قَامَتْ\n٭ اس جگہ ھِنْدٌ موئنث حقیقی ہے اس لئے فعل قَامَتْ کو موئنث لانا واجب ہوگا ،جیسے  قَامَتْ ھِنْدٌ، قَامَ ھِنْدٌ  کہنا نا جائز ہوگا\n٭  جب فعل کا فاعل موئنث کی ضمیر ہو جیسے ھِنْدٌ قَامَتْ ،یہاں فعل کا فاعل ھِیَ ضمیر ہے جو  قَامَتْ میں چھپی ہوئی ہے تو فعل کے فاعل کو موئنث لانا واجب ہوگا ، جیسے ھِنْدٌ قَامَتْ، ھِنْدٌ قَامَ کہنا نا جائز ہوگا\nاور اسم ظاہر موئنث غیر حقیقی (موئنث غیر حقیقی وہ ہوتی ہے جس کے مقابلے میں حیوان مذکر ناہو)اور اسم ظاہر جمع مکسر  (جس کی واحد کی بنا سلامت نا ہو)  میں دو وجہ پڑھنی جائز ہیں  جیسے طَلَعَ الشَّمْسُ ، طَلَعَتِ الشَّمْسُ ، قَالَ الرِّجَالُ ، قَالَتِ الرِّجَالُ"}, {"id": "c15t6", "title": "دوسری قسم مجہول", "content": "دوسری قسم مجہول"}, {"id": "c15t7", "title": "جان تو جو فعل مجہول فاعل کی جگہ میں…", "content": "جان تو جو فعل مجہول فاعل کی جگہ میں واقع ہونے والے مفعول بہٖ  کو رفع دیتا ہے اور باقی(مفعولات یعنی مفعول مطلق ، مفعول فیہ،مفعول معہ، مفعول لہٗ) کو نصب دیتا ہے جیسے ضُرِبَ زَیْدٌ یَوْمَ  الْجُمُعَۃِ اَمَامَ الْاَمِیْرِ  ضَرْبًا شَدِیْدًا فِیْ دَارِہٖ  تَادِیْبًا وَالْخَشْبَۃَ ( زید پر شدید مار پڑی لکڑی سے جمعہ کے دن سردار کے سامنے سردار کے گھر میں ادب سکھانے کے لئے )\n٭ ضُرِبَ(فعل مجہول)  ،زَیْدٌ  ( فاعل کی جگہ میں واقع ہونے والا مفعول بہٖ)، یَوْمَ  الْجُمُعَۃِ( مفعول فیہ  )، اَمَامَ الْاَمِیْرِ  (مفعول فیہ)، ضَرْبًا (مفعول مطلق )،  شَدِیْدًا فِیْ دَارِہٖ ، تَادِیْبًا (مفعول لہٗ)، وَالْخَشْبَۃَ( مفعول معہ)\n٭ مندرجہ بالا مثال میں مفعول بہٖ مرفوع ہے باقی جملہ مفعول منصوب ہیں ،فعل مجہول کو فعل مَا لَمْ یُسَمَّ فَاعِلُہٗ بھی کہتے ہیں اور اس فعل کے مرفوع کو مفعول مَا لَمْ یُسَمَّ فَاعِلُہٗ اور نائب فاعل بھی کہتے ہیں"}]}, {"id": "c16", "title": "فعل متعدی کے بیان میں", "topics": [{"id": "c16t0", "title": "جان تو جو فعل متعدی چار(4) قسم پر ہ…", "content": "جان تو جو فعل متعدی چار(4) قسم پر ہے"}, {"id": "c16t1", "title": "متعدی بیک مفعول", "content": "متعدی بیک مفعول  : فعل  متعدی کی پہلی قسم متعدی طرف ایک مفعول کے ہےجیسے ضَرَبَ زَیْدٌ عَمْرًا \n٭ ضَرَبَ (فعل متعدی ) طرف ایک مفعول (عَمْرًا) کےہے"}, {"id": "c16t2", "title": "متعدی بدو مفعول", "content": "متعدی بدو مفعول : فعل  متعدی کی دوسری  قسم متعدی طرف دومفعولوں کے ہے جو  کفایت کرنا ایک مفعول پر بھی جائز ہوگا جیسے اَعْطٰی اور وہ جو اَعْطٰی کے معنی میں ہو\n٭اَعْطٰی کو  دو مفعولوں کی ضرورت پڑتی ہے اگر اس کو ایک مفعول بھی دے دیا جائے تو کفایت کرتا ہے جیسے اَعْطیْتُ زَیْدًا دِرْھَمًا (میں نے زید کو درہم دیا ) ، اس  جگہ اَعْطیْتُ زَیْدًا کہنا بھی جائز ہوگا دوسرے مفعول کو لانا ضروری نہیں \n٭ اَعْطیْتُ (فعل) زَیْدًا(نائب فاعل) دِرْھَمًا (دوسرا مفعول )"}, {"id": "c16t3", "title": "متعدی بدو مفعول", "content": "متعدی بدو مفعول: فعل  متعدی کی تیسری   قسم متعدی طرف دومفعولوں کے ہے جو  کفایت کرنا ایک مفعول پر جائز نہیں  ہوگا ، دو مفعول جن افعال کو دینا واجب ہے ان افعال کو افعال قلوب کہتے ہیں اور وہ سات (7) ہیں \n1. عَلِمْتُ(میں نے جانا)      2. ظَنَنْتُ(میں نے گمان کیا)     3.حَسِبْتُ(میں نے سمجھا)     4.خِلْتُ(میں نے خیال کیا)      5.زَعَمْتُ(میں نے دعویٰ کیا)     6. رَاَیْتُ(میں نے دیکھا)     7.وَجَدْتُ(میں نے پایا) \n٭ عَلِمْتُ زَیْدًا فَاضِلًا اس جگہ  عَلِمْتُ زَیْدًا کہنا جائز نہیں ہوگا اس کے لئے دوسرا مفعول لانا واجب ہوگا جیسے  عَلِمْتُ(فعل)زَیْدًا (نائب فاعل)فَاضِلًا  (مفعول) ، اور ظَنَنْتُ زَیْدًا عَالِمًا والی مثال بھی اسی طرح ہے"}, {"id": "c16t4", "title": "فعل متعدی بسہ مفعول", "content": "فعل متعدی بسہ مفعول: فعل  متعدی کی چوتھی   قسم ہے  متعدی طرف تین مفعولات کے ، سات(7) فعل ایسے ہیں جو متعدی ہوتے ہیں طرف تین(3) مفعولات کے\n1.اَعْلَمَ   2.اَرٰی   3.اَنْبَأَ      4.اَخْبَرَ    5. خَبَّر    6.نَبَأَ      7.حَدَّثَ\n٭ جیسے اَعْلَمَ اللہُ زَیْدًا عَمْرًا فَاضِلًا (اللہ تعالیٰ نے زید کو بتایا کہ عمروفاضل ہے)، اس مثال میں اَعْلَمَ (فعل)،اللہُ(فاعل)، زَیْدًا(نائب فاعل)، عَمْرًا(دوسرامفعول) فَاضِلًا(تیسرا مفعول)"}, {"id": "c16t5", "title": "جان توجو تمام مفعولات مفعول بہٖ ہیں…", "content": "جان توجو تمام مفعولات مفعول بہٖ ہیں دوسرا مفعول  عَلِمْتُ کے باب میں اور  تیسرا مفعول اَعْلَمْتُ کے باب میں  نہیں آسکتا اور مفعول لہٗ اور مفعول معہ فاعل کی جگہ میں نہیں آسکتے اور دوسرے مفعولات (مفعول مطلق،مفعول فیہ) کو  جائز ہے(یعنی ان کو فاعل کی جگہ میں رکھ سکتے ہیں)اور اَعْطَیْتُ کے باب میں مفعول پہلا ساتھ نائب فاعل کے زیادہ بہتر ہے دوسرے مفعول سے(مفعول پہلا اگر نائب فاعل ہو تو زیادہ بہتر ہے اس سے کہ اس کی جگہ دوسرا مفعول لائیں یعنی اَعْطیْتُ زَیْدًا کہنا  زیادہ بہتر ہے اَعْطیْتُ دِرْھَمًا سے )"}]}, {"id": "c17", "title": "افعال ناقصہ کے بیان میں", "topics": [{"id": "c17t0", "title": "جان تو جو افعال ناقصہ 17 ہیں\t1.کَان…", "content": "جان تو جو افعال ناقصہ 17 ہیں\t1.کَانَ    2.صَارَ   3.ظَلَّ    4.بَاتَ    5.اَصْبَحَ   6.اضْحَی     7.اَمْسٰی    8.عَادَ     9.اٰضَ      10.غَدَا     11.رَاحَ      12.مَازَالَ     13.مَا انْفَکَّ     14.مَابَرِحَ      15.مَا فَتِئَ   16.مَادَامَ    17.لَیْسَ \tیہ افعال صرف فاعل پر پورے نہیں ہوتے اور محتاج ہوتے ہیں کسی خبر کے اس وجہ سے ان کو افعال ناقصہ کہتے ہیں \n٭ افعال ناقصہ جملہ اسمیہ میں داخل ہوتے ہیں اور مسند الیہ کو رفع دیتے ہیں اور مسند کو نصب جیسے  کَانَ زَیْدٌ قَائِمًا ،مرفوع کو اسم کَانَ کا کہتے ہیں اور منصوب کو خبر کَانَ کی ، اور باقی افعال ناقصہ کا بھی یہی طریقہ ہے"}, {"id": "c17t1", "title": "جان تو جو کچھ افعال ناقصہ کچھ حالات…", "content": "جان تو جو کچھ افعال ناقصہ کچھ حالات میں صرف فاعل پر پورے ہوجاتے ہیں اور ان کو خبر کی ضرورت نہیں پڑتی جیسے کَانَ مَطْرٌ(ہوئی بارش)  کَانَ بمعنی حَصَلَ کے ہے اور اس کو کَانَ تامہ کہتے ہیں اور کَانَ زائدہ بھی ہوتا ہے۔\n\nکَانَ کی تین اقسام ہیں"}, {"id": "c17t2", "title": "کَانَ ناقصہ", "content": "کَانَ ناقصہ: اس صورت میں  کَانَ محتاج ہوتا ہے کسی خبر کا جیسے کَانَ زَیْدٌ قَائِمًا"}, {"id": "c17t3", "title": "کَانَ تامہ", "content": "کَانَ تامہ: اس صورت میں  کَانَ محتاج نہیں ہوتا کسی خبر کا جیسے کَانَ مَطْرٌ"}, {"id": "c17t4", "title": "کَانَ زائدہ", "content": "کَانَ زائدہ: اس صورت میں  کَانَ لفظی اور معنوی طور پر کوئی عمل نہیں کرتا اور اگر اسے کلام سے  حذف کردیا جائے تو کلام کے مفہوم میں بھی کوئی فرق نہیں پڑتا اور یہ ہمیشہ وسط کلام میں آتا ہے جیسے لَا یُوْجَدُ کَانَ مِثْلَکَ (تیری  مثال کوئی موجود نہیں)"}]}, {"id": "c18", "title": "افعال مقاربہ کے بیان میں", "topics": [{"id": "c18t0", "title": "جان تو جو افعال مقاربہ چار ہیں (مصن…", "content": "جان تو جو افعال مقاربہ چار ہیں (مصنف ؒکےمطابق)\t1.عَسٰی    2.کَادَ     3.کَرَبَ     4.اَوْشَکَ"}, {"id": "c18t1", "title": "٭یہ افعال عمل کرنے میں ناقص کی طرح …", "content": "٭یہ افعال عمل کرنے میں ناقص کی طرح ہیں ، یہ افعال جملہ اسمیہ میں داخل ہوتے ہیں اور اسم کو رفع دیتے ہیں اور خبر کو نصب دیتے ہیں ،لیکن شرط یہ ہے کہ خبر ان کی فعل مضارع ہو \n٭اَنْ کے ساتھ جیسے عَسٰی زَیْدٌ اَنْ یَخْرُجَ  یا اَنْ کے بغیر جیسے  عَسٰی زَیْدٌ  یَخْرُجُ اور ہوسکتا ہے جو فعل مضارع اَنْ کے ساتھ فاعل عسٰی کا ہواور خبر کی ضرورت نا پڑےجیسے  عَسٰی اَنْ یَخْرُجَ   زَیْدٌ اس جگہ  یَخْرُجَ    محلًا مرفوع ہے مصدر کے معنی میں عَسٰی خُرُوْجُ   زَیْدٍ"}]}, {"id": "c19", "title": "افعال مدح و ذم کے بیان میں", "topics": [{"id": "c19t0", "title": "جان تو جو افعال مدح و ذم چار ہیں \t1…", "content": "جان تو جو افعال مدح و ذم چار ہیں \t1.نِعْمَ    2.حَبَّذا  واسطے تعریف کے   3.بِئْسَ     4.سَاءَ      واسطے  مذمت کے"}, {"id": "c19t1", "title": "٭ہر جو فاعل کے بعد واقع ہوگا اس کو …", "content": "٭ہر جو فاعل کے بعد واقع ہوگا اس کو مخصوص بالمدح یا مخصوص بالذم کہیں گے ، لیکن اس کی تین شرطیں ہیں جو کہ مندرجہ ذیل ہیں"}, {"id": "c19t2", "title": "فاعل معرف بلَّام ہو", "content": "فاعل معرف بلَّام ہو: جیسے نِعْمَ الرَّجُلُ زَیْدٌ  ، نِعْمَ (فعل مدح)، الرَّجُلُ (فاعل) ، زَیْدٌ ( مخصوص بالمدح)"}, {"id": "c19t3", "title": "مضاف طرف معرف بلَّام کے ہو", "content": "مضاف طرف معرف بلَّام کے ہو: جیسے نِعْمَ الْصَاحِبُ الْقَوْ مِ زَیْدٌ  ، نِعْم (فعل مدح)،صَاحِبُ(فاعل ہے جو کہ  مضاف ہے )، الْقَوْمِ (مضاف الیہ )، زَیْدٌ ( مخصوص بالمدح)"}, {"id": "c19t4", "title": "ضمیر مستتر ممیز بنکرہ منصوبہ", "content": "ضمیر مستتر ممیز بنکرہ منصوبہ : جیسے نِعْمَ رَجُلًا زَیْدٌ ، فاعل نِعْمَ کا ھُوَ ہے اس میں چھپا ہوا ، رَجُلًا منصوب ہے تمیز ہونے کی وجہ سے کیوں کہ ھُوَ مبہم ہے"}, {"id": "c19t5", "title": "حَبَّذَا زَیْدٌ ،حَبَّ فعل مدح ہے ذ…", "content": "حَبَّذَا زَیْدٌ ،حَبَّ فعل مدح ہے ذَا فاعل ہے اور زَیْدٌ مخصوص بالمدح ہے ، اور افعال ذم کا بھی یہی طریقہ ہے جیسے بِئْسَ الرَّجُلُ زَیْدٌ ، سَاءَ الرَّجُلُ عَمْرٌو"}]}, {"id": "c20", "title": "اسمائے عاملہ اور فعل تعجب کے بیان میں", "topics": [{"id": "c20t0", "title": "جان تو جو فعل تعجب کہ دو صیغے ثلاثی…", "content": "جان تو جو فعل تعجب کہ دو صیغے ثلاثی مجر د کے ہر باب سے ہوتے ہیں  ان کہ اوزان یہ ہیں                                                                                1.مَا اَفْعَلَہٗ     2.اَفْعِلْ بِہٖ"}, {"id": "c20t1", "title": "ما اَفْعَلَہٗ", "content": "ما اَفْعَلَہٗ: جیسے مَا اَحْسَنَ زَیْدًا ( کتنا خوبصورت ہے زید)، اصل عبارت یوں تھی ایُّ شَیْ ءٍ اَحْسَنَ زَیْدًا ، مَا ساتھ معنی ایُّ شَیْ ءٍ کے ہے \n٭ مَا محلًا مرفوع ہے مبتداء ہونے کی وجہ سے ، اَحْسَنَ محلاً منصوب ہے خبر مبتداء کی، فاعل اَحْسَنَ کا ھُوَ ہے اس میں چھپا ہوا ، زَیْدًا مفعول بہٖ ہے"}, {"id": "c20t2", "title": "اَفْعِلْ بِہٖ", "content": "اَفْعِلْ بِہٖ:جیسے  اَحْسِنْ بِزَیْدٍ ، اَحْسِنْ صیغہ امر کا ہے خبر کے معنی کے ساتھ \n٭ اصل عبار ت یوں ہے صَارَذَا حُسْنٍ ، اَحْسِنْ کے بعد بِزَیْدٍ میں جو با ہے وہ زائدہ ہے"}, {"id": "c20t3", "title": "اسمائے شرطیہ", "content": "اسمائے شرطیہ: اِنْ  کے معنی کے ساتھ اور نو(9) اسماءہیں  \t1.مَن   2.مَا    3.اَیْنَ     4.مَتٰی      5.اَیٌّ       6.اَنّٰی      7.اِذْمَا      8.حَیْثُمَا     9.مَھْمَا"}, {"id": "c20t4", "title": "٭ یہ اسماء فعل مضارع کو نصب دیتے ہی…", "content": "٭ یہ اسماء فعل مضارع کو نصب دیتے ہیں جیسے  مَنْ تَضْرِبْ اَضْرِبْ اور اسی طرح اور بھی اسماء فعل مضارع کو نصب دیتے ہیں"}, {"id": "c20t5", "title": "اسمائے افعال بمعنی ماضی", "content": "اسمائے افعال بمعنی ماضی: دوسری قسم اسمائے عاملہ کی اسمائے افعال ہے ساتھ معنی ماضی کے جیسے ھَیْھَات (بَعُدَ کے معنی کے ساتھ) ، شَتَّانَ (اِفْتَرَقَ کے معنی کے ساتھ ) اور سَرْعَانَ (سَرُع َکے معنی کے ساتھ )"}, {"id": "c20t6", "title": "٭ یہ اسم کو رفع دیتے ہیں فاعل ہونے …", "content": "٭ یہ اسم کو رفع دیتے ہیں فاعل ہونے کی وجہ سے جیسے ھَیْھَاتَ یَوْمُ الْعِیْدِ ، ھَیْھَاتَ (اسم فعل بمعنی ماضی) اس نے یَوْمُ(فاعل)کو رفع دیا"}, {"id": "c20t7", "title": "اسمائے افعال بمعنی امر حاضر", "content": "اسمائے افعال بمعنی امر حاضر:تیسری  قسم اسمائے عاملہ کی اسمائے افعال ہے ساتھ معنی امرحاضر کے جیسے رُوَیْدَ ، بَلْہَ،حَیَّھَلْ، عَلَیْکَ،دُوْنَکَ،ھَا"}, {"id": "c20t8", "title": "٭یہ اسماء اسم کو نصب دیتے ہیں مفعول…", "content": "٭یہ اسماء اسم کو نصب دیتے ہیں مفعول ہونے کی وجہ سے  جیسے رُوَیْدَ زَیْدًا، رُوَیْدَ( اسم فعل بمعنی امر حاضر) ،زَیْدً (مفعول بہٖ)"}, {"id": "c20t9", "title": "اسم فاعل", "content": "اسم فاعل: اسم فاعل اس وقت عمل کرے گا جب اس کے اندر دو شرطیں پائیں جائیں،اگر فعل لازم ہوگا تو فاعل کو رفع دے گا اور اگر فعل متعدی ہوگا تو فاعل کو رفع دیگا  اور مفعول بہٖ کو نصب دیگا"}, {"id": "c20t10", "title": "اسم فاعل حال یا استقبال کے معنی کے …", "content": "اسم فاعل حال یا استقبال کے معنی کے ساتھ ہو"}, {"id": "c20t11", "title": "اسم فاعل اپنے سے پہلے آنے والے چھ(6…", "content": "اسم فاعل اپنے سے پہلے آنے والے چھ(6) لفظوں میں سے کسی ایک لفظ پر سہارا لئے ہوئے ہو اور وہ چھ(6) لفظ مندرجہ ذیل ہیں"}, {"id": "c20t12", "title": "مبتداء", "content": "مبتداء: فعل لازم میں جیسے زَیْدٌ قَائمٌ اَبُوہُ (زید کا باپ کھڑا ہے یا ہوگا)، زَیْدٌ(مبتداء) ، قَائمٌ (اسم فاعل)،اَبُوْہُ( فاعل ) ، یافعل متعدی میں جیسے زَیْدٌ ضَارِبٌ اَبُوْہُ عَمْرًا ( زید کا باب عمرو کو مارتا ہے یا مارے گا ) ، زَیْدٌ(مبتداء) ،ضَارِبٌ(اسم فاعل) ،اَبُوْہُ(فاعل) ، عَمْرًا (مفعول بہٖ)"}, {"id": "c20t13", "title": "موصوف", "content": "موصوف : جیسے مَرَرْتُ بِرَجُلٍ ضَارِبٍ اَبُوْہُ بَکْرًا (میں ایسے مرد کے پاس سے گذرا جس کا باپ بکر کو مارتاہےیامارےگا)،مَرَرْتُ(فعل)،رَجُلٍ(موصوف)،ضَارِبٍ(اسم فاعل)،اَبُوْہُ(فاعل)،بَکْرًا (مفعول بہٖ)"}, {"id": "c20t14", "title": "موصول", "content": "موصول:فعل لازم میں  جیسے جَاءَنِی الْقَائِمُ اَبُوْہُ(میرے پاس وہ شخص آیا جس کا باپ کھڑا ہے یا کھڑا ہوگا)، جَاءَنِی(فعل)، الف لام (بمعنی الَّذِیْ اسم موصول )،قَائِمُ(اسم فاعل)،  اَبُوْہُ( ْفاعل)اور فعل متعدی میں جیسے جَاءنِی الضَّارِبُ اَبُوْہُ عَمْرًا ( میرے پاس وہ شخص آیا جس کا باپ نے عمر کو  مارتا ہے یا مارے گا)، جَاءنِی(فعل) ، الف لام (بمعنی الَّذِیْ اسم موصول)،ضَارِبُ(اسم فاعل) ، اَبُوْہُ(فاعل)، عَمْرًا(مفعول بہٖ)"}, {"id": "c20t15", "title": "ذوالحال", "content": "ذوالحال: جیسے جَاءنِی زَیْدٌ رَاکِبًا غُلَامُہٗ فَرَسًا( میرے پاس زید آیا در آں حالیکہ اس کا غلام گھوڑے پر سوار تھا)، جَاءنِی(فعل)، زَیْدٌ(ذوالحال)، رَاکِبًا(اسم فاعل)، غُلَامُہٗ(فاعل) فَرَسًا(مفعول بہٖ)"}, {"id": "c20t16", "title": "ہمزہ استفہام", "content": "ہمزہ استفہام: جیسے اَضَارِبُ زَیْدٌعَمْرًا(کیا زید عمر و کو مارتا ہے یا مارے گا)، اَ(ہمزہ استفہام)، ضَارِبُ(اسم فاعل)، زَیْدٌ(فاعل) ،عَمْرًا(مفعول بہٖ)"}, {"id": "c20t17", "title": "حرف نفی", "content": "حرف نفی: جیسے مَا قَائِمٌ زَیْدٌ ( زید کھڑا نہیں ہے یا نہیں ہوگا)، مَا(حرف نفی) ، قَائِمٌ(اسم فاعل)، زَیْدٌ(فاعل)\n٭جو عمل قَامَ  اور ضَرَبَ  کرتے ہیں  وہی عمل  قَائِمٌ اور ضَارِبٌ کریں گے ، یعنی  فعل لازم کے فاعل کو رفع دیں گے اور فعل متعدی کے فاعل کو رفع اور مفعول بہٖ کو نصب دیں گے"}, {"id": "c20t18", "title": "اسم مفعول", "content": "اسم مفعول: اسم مفعول عمل فعل مجہول والا ( فعل مجہول فاعل کی جگہ میں واقع ہونے والے مفعول بہٖ کو رفع دیتا ہے اور باقی مفعولات کو نصب دیتا ہے)  کرے گا جب اس کے اندر دو شرطیں پائیں جائیں گی وہ دو شرطیں مندرجہ ذیل ہیں"}, {"id": "c20t19", "title": "اسم مفعول حال یا استقبال کے معنی کے…", "content": "اسم مفعول حال یا استقبال کے معنی کے ساتھ ہو"}, {"id": "c20t20", "title": "اسم مفعول اپنے سے پہلے آنے والے چھ(…", "content": "اسم مفعول اپنے سے پہلے آنے والے چھ(6) لفظوں میں سے کسی ایک لفظ پر سہارا لئے ہوئے ہو"}, {"id": "c20t21", "title": "٭جیسے زَیْدٌ مَضْرُوْبٌ اَبُوْہُ،  …", "content": "٭جیسے زَیْدٌ مَضْرُوْبٌ اَبُوْہُ،   مَضْرُوْبٌ ایسا مفعول جو ایک مفعول  کی طرف متعدی ہوتا ہے، مَضْرُوْبٌ نائب فاعل اور    زَیْدٌ مبتداءکا سہارا لئے ہوئے ہے ، اَبُوْہُ مفعول کو رفع دے رہا ہے (اس کا رفع واؤ کے ساتھ ہے)"}, {"id": "c20t22", "title": "٭عَمْرٌو مُعْطًی غُلَامُہٗ دِرْھَمً…", "content": "٭عَمْرٌو مُعْطًی غُلَامُہٗ دِرْھَمًا ، مُعْطًی ایسا مفعول جو دو مفعول  کی طرف متعدی ہوتا ہے اور کفایت کرنا ایک مفعول پر بھی جائز  ہوتا ہے ، مُعْطًی نائب  فاعل ہے اور  عَمْرٌو مبتداء کاسہارا لئے ہوئے ہے، غُلَامُہٗ(پہلا مفعول) اور  دِرْھَمًا  (دوسرا مفعول) کو رفع دے رہا ہے"}, {"id": "c20t23", "title": "٭ بَکْرٌ مَعْلُوْمُ نِابْنُہٗ فَاضِ…", "content": "٭ بَکْرٌ مَعْلُوْمُ نِابْنُہٗ فَاضِلًا ، مَعْلُوْمُ ایسا مفعول جو دو مفعول  کی طرف متعدی ہوتا ہے اور کفایت کرنا ایک مفعول پر جائز   نہیں ہوتا ہے، مَعْلُوْمُ نائب  فاعل ہے اور   بَکْرٌ مبتداء کاسہارا لئے ہوئے ہے، ابْنُہٗ (پہلا مفعول) اور  فَاضِلًا(دوسرا مفعول) کو رفع دے رہا ہے"}, {"id": "c20t24", "title": "٭خَالِدٌ مُخْبَرُ نِ ابْنُہٗ عَمْرً…", "content": "٭خَالِدٌ مُخْبَرُ نِ ابْنُہٗ عَمْرًا فَاضِلًا ،  مُخْبَرُ ایسا مفعول جو تین مفعول  کی طرف متعدی ہوتا ہے، مُخْبَرُ نائب  فاعل ہے اور    خَالِدٌ مبتداء کاسہارا لئے ہوئے ہےاور  ابْنُہٗ (پہلا مفعول)   ، عَمْرًا(دوسرا مفعول) اور  فَاضِلًا (تیسرےمفعول) کو رفع دے رہا ہے\n٭ وہی عمل جو ضُرِبَ ، اُعْطِیَ، عُلِمَ ، اُخْبِرَ کرتےتھے  وہی عمل مَضْرُوْبٌ، مُعْطًی ، مَعْلُوْمٌ ،  مُخْبَرٌ  کرتے ہیں"}, {"id": "c20t25", "title": "صفت مشبہ", "content": "صفت مشبہ: یہ اسم عمل کرنے میں فعل لازم کے ساتھ مشابہت رکھتے ہیں ، یعنی اپنے فاعل کو رفع دیتے ہیں اور مفعول بہٖ ان پر نہیں آتا اور صفت مشبہ  میں حال یا استقبال کا معنی نہیں آتا  اس لئے کہ صفت مشبہ ہمیشگی کے معنی پر دلالت کرتی ہے، یہ اس وقت عمل کرتے ہیں جب ان میں ایک شرط پائی جائے"}, {"id": "c20t26", "title": "صفت مشبہ اپنے سے پہلے آنے والے پانچ…", "content": "صفت مشبہ اپنے سے پہلے آنے والے پانچ (5) لفظوں میں سے کسی ایک پر سہارا لئے ہوئے ہو، صفت مشبہ اسم موصول (اَلَّذِیْ)  اور الف لام کا سہارا نہیں لیتا"}, {"id": "c20t27", "title": "٭جیسے  زَیْدٌحَسَنٌ غُلَامُہٗ ،حَسَ…", "content": "٭جیسے  زَیْدٌحَسَنٌ غُلَامُہٗ ،حَسَنٌ صفت مشبہ کا صیغہ ہے اور اس نے  زَیْدٌ مبتداءکا سہارا لئے ہوئے ہے اور غُلَامُہٗاسم فاعل  کو رفع دے رہا ہے"}, {"id": "c20t28", "title": "اسم تفضیل", "content": "اسم تفضیل : اسم تفضیل کا استعمال تین طریقوں کے ساتھ ہے"}, {"id": "c20t29", "title": "من کے ساتھ", "content": "من کے ساتھ: جیسے زَیْدٌ اَفْضَلُ مِنْ عَمْرٍ"}, {"id": "c20t30", "title": "الف لام کے ساتھ", "content": "الف لام کے ساتھ: جیسے جَاءَنِیْ زَیْدُنِ الْاَفْضَلُ"}, {"id": "c20t31", "title": "اضافت کے ساتھ", "content": "اضافت کے ساتھ: جیسے زَیْدٌ اَفْضَلُ الْقَوْمِ\n٭ اسم تفضیل کا عمل فاعل میں ہوتا ہے اوراَفْضَلُ کا فاعل ھُوَ ہے جو اس میں چھپا ہوا ہے( اسم تفضیل کا فاعل ہمیشہ ضمیر مستتر ہوتی ہے)"}, {"id": "c20t32", "title": "اسم مصدر", "content": "اسم مصدر: یہ اسم عمل فعل اپنے کا کرتا ہے(اگر مصدر لازم ہوگا تو فاعل کو رفع دیگا اور اگر متعدی ہوگا تو  فاعل کو رفع بھی دیگا اورمفعول بہٖ کو  نصب بھی دیگا) ، لیکن شرط یہ ہے کہ اسم مصدر مفعول مطلق نا ہو\n٭ جیسے اَعْجَبَنِیْ ضَرْبُ زَیْدٍ عَمْرًا  ، زَیْدٍ فاعل معنًا مرفوع ہے اور لفظًا مجرور ہے"}, {"id": "c20t33", "title": "اسم مضاف", "content": "اسم مضاف: اسم مضاف مضاف الیہ کو جر دیتا ہے \n٭ جیسے جَاءَنِیْ غُلَامُ زَیْدٍ، زَیْدٍ مضاف الیہ ہے اس لئے مجرور ہے ، اس جگہ لام حقیقت میں چھپی ہوئی ہے اس وجہ سے جو اصل اسکی ہے غُلَامٌ لِّزَیْدٍ"}, {"id": "c20t34", "title": "اسم تام", "content": "اسم تام: اسم تام وہ اسم ہوتا ہے جو اپنی موجودہ حالت میں مضاف نا ہوسکے ، اسم تام تمیز کو نصب دیتا ہے ،  اسم تام اس وقت ہوتا ہے جب اس کو چھ (6) چیزیں مل جائیں                                        1. تنوین                                              2. تقدیر تنوین                                                3. نون تثنیہ                                        4. نون جمع                                                   5. مشابہ نون جمع                                              6.اضافت"}, {"id": "c20t35", "title": "تنوین", "content": "تنوین : جیسے  مَا فِی السَّمَاءِ قَدْرُ رَاحَۃٍ سَحَابًا ( آسمان پر ہتھیلی جتنا بادل بھی نہیں ہے)، رَاحَۃٍ میں جو تنوین ہے اس سے اسم تام ہو رہا ہے اور سَحَابًا تمیزہے اس لئے منصوب ہے اور رَاحَۃٍ ممیز ہے"}, {"id": "c20t36", "title": "تقدیر تنوین", "content": "تقدیر تنوین: جیسے عِنْدِیْ اَحَدَ عَشَرَ رَجُلًا (میرے پاس گیارہ مرد ہیں)، جواصل میں  اَحَدٌوَّ عَشَرٌ تھا،تنوین اصل میں مقدر ہے یہاں تنوین مقدرہ سے اسم تام ہورہا ہے اور دِرْھَمًا تمیزہے اس لئے منصوب ہے اور اَحَدَ عَشَرَ ممیز ہے یا جیسے زَیْدٌ اَکْثَرُمِنْکَ مَالًا  ، اَکْثَرُ اسم تفضیل کا صیغہ ہے چونکہ اسم تفضیل پر تنوین مقدر ہوتی ہے اس لئے یہاں بھی  تنوین مقدرہ سے اسم تام ہورہا ہے اور مَالًا  تمیزہے اس لئے منصوب ہےاور اَکْثَرُ ممیز ہے"}, {"id": "c20t37", "title": "نون تثنیہ", "content": "نون تثنیہ: جیسے عِنْدِیْ قَفِیْزَانِ بُرًّا (میرے پاس دو بوریاں گندم کی ہیں ) ، قَفِیْزَانِ یہ نون مکسور تثنیہ کا ہے اور اسم اس نون تثنیہ کے ساتھ تام ہورہا ہے، بُرًّا تمیزہے اس لئے منصوب ہے اور قَفِیْزَانِ ممیز ہے"}, {"id": "c20t38", "title": "نون جمع", "content": "نون جمع: ھَلْ نُنَبِئُکُمْ بِالْاَخْسَرِیْنَ اَعْمَالًا(کیا ہم تمہیں بتادیں کہ سب سے بڑھ کر ناقص عمل کن کے ہیں)، بِالْاَخْسَرِیْنَ یہ  نون  مفتوح جمع کا ہے اور اسم اس نون کے ساتھ تام ہو رہا ہے  اور اَعْمَالًا تمیزہے اس لئے منصوب ہے اور اَلْاخْسَرِیْنَ ممیز ہے"}, {"id": "c20t39", "title": "مشابہ نون جمع", "content": "مشابہ نون جمع:یعنی نون جمع کا نا ہو لیکن جمع کے نون کے ساتھ مشابہت رکھتاہو جیسے عِنْدِیْ عِشْرُوْنَ دِرْھَمًا(میرے پاس بیس درھم ہیں)  ، عِشْرُوْنَ سے تِسْعُوْنَ تک ( عِشْرُوْنَ، ثَلٰثُوْنَ، اَرْبَعُوْنَ، خَمْسُوْنَ، سِتُّوْنَ، سَبْعُوْنَ، ثَمَانُوْنَ ، تِسْعُوْنَ) یہ نون مفتوح اگر چہ جمع کےنہیں ہیں لیکن جمع کے ساتھ مشابہت رکھتے ہیں اور اسم ان  نون مفتوح کے ساتھ تام ہو رہا ہے، دِرْھَمًا  تمیزہے اس لئے منصوب ہے  اور عِشْرُوْنَ ممیز ہے"}, {"id": "c20t40", "title": "اضافت", "content": "اضافت: جیسے عِنْدِیْ مِلْؤُہٗ عَسَلًا(میرے پاس فلاں برتن کے بھرنے کے برابر شہد ہے) ، مِلْؤُ مضاف ہے اور ہٗ ضمیر مجرور متصل مضاف الیہ ہے ،  یہاں اسم تام ہو رہا ہے ، عَسَلًا تمیزہے اس لئے منصوب ہے اور مِلْؤُہٗ  ممیز ہے"}, {"id": "c20t41", "title": "اسمائے کنایہ (تعداد سے)", "content": "اسمائے کنایہ (تعداد سے):  آخری قسم اسمائے عاملہ کی  تعداد سے اسمائے کنایہ کی ہے اور وہ دو لفظ ہیں\t   1.کَمْ      \t 2. کَذَا"}, {"id": "c20t42", "title": "کَمْ ان کی دو قسمیں ہیں", "content": "کَمْ ان کی دو قسمیں ہیں"}, {"id": "c20t43", "title": "کَمْ استفہامیہ", "content": "کَمْ استفہامیہ:  یہ تمیز کو  نصب دیتا ہے ، جیسے کَمْ رَجُلًا عِنْدَکَ(کتنے مرد ہیں تیرے پاس)یہاں کَمْ استفہامیہ  نے عِنْدَکَ تمیز کو نصب دیا  اور کَذَا بھی تمیز کو نصب دیتا ہے جیسے عِنْدِیْ کَذَا دِرْھَمًا (میرے پاس اتنے درھم ہیں) یہاں کَذَا نے دِرْھَمًا تمیز کو نصب دیا"}, {"id": "c20t44", "title": "کَمْ خبریہ", "content": "کَمْ خبریہ: یہ تمیز کوجر دیتا ہے ، جیسے کَمْ مَالٍ اَنْفَقْتُ(بہت مال خرچ کیا میں نے)، یہاں کَمْ خبریہ  نے مَالٍ تمیز کو جر دیا  اور  جیسے کَمْ دَارٍ بَنَیْتُ ( بہت گھر بنائے میں نے) ،  یہاں کَمْ خبریہ  نے دَارٍ تمیز کو جر دیا  اور   کبھی مِنْ جارہ کَمْ خبریہ کی تمیز پر آتا ہے جیسے کہ قرآن مجید میں ہےجیسے كَمْ مِّنْ مَّلَكٍ فِی السَّمٰوٰتِ ( آسمانوں میں کتنے ہی فرشتے ہیں)"}, {"id": "c20t45", "title": "دوسری قسم عوامل معنوی میں", "content": "دوسری قسم عوامل معنوی میں"}, {"id": "c20t46", "title": "جان تو جو عوامل معنوی دو قسم پر ہیں…", "content": "جان تو جو عوامل معنوی دو قسم پر ہیں \t1.ابتداء \t\t2. خالی ہونا  مضارع کا نواصب و جوازم سے"}, {"id": "c20t47", "title": "ابتداء", "content": "ابتداء:  پہلی قسم عوامل معنوی   کی ابتداء ہےیعنی خالی ہونا اسم کا عوامل لفظی سے جو  مبتداء اور خبر کو رفع دیتا ہے  جیسے زَیْدٌ قَائْمٌ ، اس جگہ زَیْدٌ مبتداء ہے اور اس کو رفع  ابتداء(خالی ہونا اسم کا عوامل لفظی سے) دے رہا ہے، اور قَائمٌ خبر ہے اور مرفوع ہے تو اس کو بھی  رفع ابتداء دے رہا ہے،یعنی اسم کا خالی ہونا عوامل لفظی سے زَیْدٌ کو بھی رفع دے رہا ہے اور قَائِمٌ کو بھی رفع دے رہا ہے ، اور اس جگہ نحویوں کے دو مذہب ہیں"}, {"id": "c20t48", "title": "پہلا مذہب یہ ہے کہ ابتداء عامل ہے م…", "content": "پہلا مذہب یہ ہے کہ ابتداء عامل ہے مبتداء میں اور مبتداء عامل ہے خبر میں جیسے زَیْدٌ قَائْمٌ، اس مذہب کے مطابق زَیْدٌ مبتداء ہے اور اس کو رفع  ابتداءدے رہا ہے  ، اور قَائمٌ خبر ہے اور مرفوع ہے اس کو رفع مبتداء دے رہا ہے"}, {"id": "c20t49", "title": "دوسرا مذہب یہ ہے کہ ہر ایک مبتداء ا…", "content": "دوسرا مذہب یہ ہے کہ ہر ایک مبتداء اور خبر سے عامل ہے یعنی مبتداء خبر میں عامل ہے  اور خبر مبتداء میں عامل ہے ۔ مبتداء خبر کو رفع دیتا ہے اور خبر مبتداء کو رفع دیتی ہے"}, {"id": "c20t50", "title": "خلو فعل  مضارع", "content": "خلو فعل  مضارع : یعنی  خالی ہونا فعل مضارع کا نواصب اور جوازم سے  فعل مضارع کو رفع دیتا ہےجیسے یَضْرِبُ زَیْدٌ ، اس جگہ یَضْرِبُ مرفوع ہے کیونکہ حروف ناصبہ اور جازمہ سے خالی ہے"}, {"id": "c20t51", "title": "پورے ہوئے عوامل نحو کے بِتَوْفِیْقِ…", "content": "پورے ہوئے عوامل نحو کے بِتَوْفِیْقِ اللہِ تَعَالیٰ وَ عَوْنِہٖ"}, {"id": "c20t52", "title": "یہ باب تین فصلوں پر مشتمل ہے\t1. توا…", "content": "یہ باب تین فصلوں پر مشتمل ہے\t1. توابع\t \t2. منصرف و غیر منصرف\t3.حروف غیر عاملہ"}]}, {"id": "c21", "title": "تابع اور اس کی اقسام کے بیان میں", "topics": [{"id": "c21t0", "title": "جان تو جو تابع  وہ لفظ ہے جو دوسرا …", "content": "جان تو جو تابع  وہ لفظ ہے جو دوسرا پہلے لفظ سےہو ساتھ اعراب پہلے کے ایک جہت سے ،یعنی اگر پہلے لفظ پر رفع آیا تو دوسرے لفظ پر بھی رفع آئے گا۔پہلے لفظ کو متبوع اور دوسرےلفظ کو تابع کہتے ہیں اور حکم تابع کا وہ ہے جو ہمیشہ اعراب میں  متبوع کے موافق ہو (اگر متبوع  مرفوع ہوگا تو پھر  تابع بھی مرفوع ہوگا، اگر متبوع منصوب ہوگا تو تابع بھی منصوب ہوگا اور اگر متبوع مجرور ہوگا تو تابع بھی مجرور ہوگا  )۔ تابع کی پانچ اقسام ہیں"}, {"id": "c21t1", "title": "صفت", "content": "صفت: صفت وہ تابع ہے جو دلالت کرے اس معنی پر جو معنی متبوع میں ہو جیسے جَاءَنِیْ رَجُلٌ عَالِمٌ، جَاءَنِیْ(فعل)، رَجُلٌ(فاعل اور متبوع) ، عَالِمٌ(صفت اورتابع)،اور اس صفت کو صِفَتْ بِحَالِہٖ بھی کہتے ہیں\n٭ متبوع کو ہم موصوف بھی کہہ سکتے ہیں ، منعوت بھی کہہ سکتے ہیں\n٭تابع کو ہم صفت بھی کہہ سکتے ہیں اور نعت بھی کہہ سکتے ہیں \nعَالِمٌ پر صفت کی تعریف صادق آتی ہے کیوں کہ عَالِمٌ ایسا  تابع ہے جو دلالت کرتا ہے اس معنی پر  جو معنی رَجُلٌ متبوع میں ہے   (علم والا معنی رَجُلٌ متبوع میں پایا گیا ہے)\n\nصفت کی دوسری قسم: صفت وہ تابع ہے جو دلالت کرے اس معنی پر جو معنی متبوع کے متعلق  میں ہوجیسے  جَاءنِیْ رَجُلٌ حَسَنٌ غُلَا مُہٗ (آیا میرے پاس ایسا مرد جو خوبصورت ہے غلام اس کا )، جَاءَنِیْ(فعل)، رَجُلٌ(فاعل ہے  اور متبوع ہے اور اس کا متعلق غُلَا مُہے ) ، حَسَنٌ(صفت)، غُلَا مُہٗ( ہٗ  ضمیر کا مرجع رَجُلٌہے ) ، اور اس صفت کو صِفَتْ بِحَالِ مُتَعَلِّقِہٖ بھی کہتے ہیں"}, {"id": "c21t2", "title": "حَسَنٌ صیغہ صفت کا ہے اور ایسا تابع…", "content": "حَسَنٌ صیغہ صفت کا ہے اور ایسا تابع ہے جو دلالت کررہا ہے اس معنی پر جو معنی متبوع کے متعلق  میں ہے"}, {"id": "c21t3", "title": "قسم اول یعنی صِفَتْ بِحَالِہٖ", "content": "قسم اول یعنی صِفَتْ بِحَالِہٖ: یہ صفت (صِفَتْ بِحَالِہ) دس چیزوں میں اپنے متبوع کے موافق ہوگی لیکن ایک وقت میں صفت کی چار چیزوں میں اپنے متبوع کے ساتھ موافقت ہوگی                                                                                                                                                         1. تعریف(معرفہ ہونا)                  2.تنکیر(نکرہ ہونا)                                3.تذکیر(مذکر ہونا)                            4.تانیث(موئنث ہونا )                                            5.اِفراد(مفرد ہونا)                              6.تثنیہ(دو کا ہونا)                                    7.جمع(دو سے زیادہ ہونا)                                          8.رفع(مرفوع ہونا)                                 9.نصب(منصوب ہونا)                              10.جر(مجرور ہونا)\n٭ جیسے عِنْدِیْ رَجُلٌ عَالِمٌ، اب دیکھیں رَجُلٌ عَالِمٌ میں رَجُلٌ بھی نکرہ ہے اور عَالِمٌ  بھی نکرہ ہے اور اسی طرح رَجُلٌ عَالِمٌ میں رَجُلٌ بھی مذکر ہے اور عَالِمٌ  بھی مذکر ہے اور اسی طرح رَجُلٌ عَالِمٌ میں رَجُلٌ بھی مفرد ہے اور عَالِمٌ  بھی مفردہے اور اسی طرح رَجُلٌ عَالِمٌ میں رَجُلٌ بھی مرفوع  ہے اور عَالِمٌ  بھی مرفوع ہے، اس مثال کے اندر صفت کی اپنے متبوع کے ساتھ چار چیزوں میں موافقت ہے\n٭ جیسے عِنْدِیْ رِجُلَانِ عَالِمَانِ، اب دیکھیں رِجُلَانِ عَالِمَانِ میں رِجُلَانِ بھی نکرہ ہے اور  عَالِمَانِ بھی نکرہ ہے، اور اس طرح رِجُلَانِ عَالِمَانِ میں رِجُلَانِ بھی مذکر ہے اور  عَالِمَانِ بھی مذکر ہے ، اور اس طرح رِجُلَانِ عَالِمَانِ میں رِجُلَانِ بھی تثنیہ ہے اور  عَالِمَانِ بھی تثنیہ ہےاور اس طرح رِجُلَانِ عَالِمَانِ میں رِجُلَانِ بھی تثنیہ ہے اور  عَالِمَانِ بھی تثنیہ ہےاور اس طرح رِجُلَانِ عَالِمَانِ میں رِجُلَانِ بھی مرفوع  ہے اور  عَالِمَانِ بھی مرفوع  ہے ،اس مثال کے اندر صفت کی اپنے متبوع کے ساتھ چار چیزوں میں موافقت ہے اور باقی مثالیں بھی اسی طرح ہیں"}, {"id": "c21t4", "title": "قسم دوم یعنی صِفَتْ بِحَالِ مُتَعَل…", "content": "قسم دوم یعنی صِفَتْ بِحَالِ مُتَعَلِّقِہٖ:یہ صفت اپنے متبوع کےساتھ پانچ (5)چیزوں میں موافق ہوتی ہے اور ایک وقت میں دو چیزوں میں موافق ہوتی ہے \n1. تعریف(معرفہ ہونا)                  2.تنکیر(نکرہ ہونا)                                 3.رفع(مرفوع ہونا)                                 4.نصب(منصوب ہونا)                              5.جر(مجرور ہونا)\nجَاءنِیْ رَجُلٌ عَالِمٌ اٰبُوْہُ (آیا میرے پاس وہ مرد جو عالم ہے باپ اسکا) ، جَاءنِیْ(فعل)  ، رَجُلٌ(فاعل  ہے اور موصوف ہے)، عَالِمٌ(رَجُلٌ کی صفت ہے صِفَتْ بِحَالِ مُتَعَلِّقِہ)،   اٰبُوْہُ (فاعل  ہے عَالِمٌ کا)\nجان تو جو نکرہ کو ساتھ جملہ خبریہ کے  صفت  لایا جا سکتا ہے  (نکرہ جملہ خبریہ کی صفت بن سکتا ہے) ،اور جملہ خبریہ میں ایسی ضمیر کا ہونا ضروری ہے جو ضمیر نکرہ کی طرف لوٹےجیسے  جَاءنِیْ رَجُلٌ اٰبُوْہُ عَالِمٌ(یہ جملہ خبریہ ہے) ، جَاءنِیْ(فعل)  ، رَجُلٌ(فاعل  ہے اور موصوف ہے)،  اب دیکھیں اس مثال میں اٰبُوْہُ ( اس میں ہُ ضمیر نکرہ رَجُلٌ کی طرف لوٹ رہی ہے)، عَالِمٌ(رَجُلٌ کی صفت ہے صِفَتْ بِحَالِ مُتَعَلِّقِہ)"}, {"id": "c21t5", "title": "تاکید", "content": "تاکید : تاکید وہ تابع ہے جو متبوع کے حال کو  پختہ کرے،نسبت(فعل کی نسبت فاعل کی طرف ) میں پختہ کرےمیں  یا  شمول(کسی شے کے عام ہونے کو) میں پختہ کرے تا کہ سننے والے کو شک نا رہے،تاکید کی دو قسمیں ہیں"}, {"id": "c21t6", "title": "1. تاکید لفظی\t\t2. تاکید معنوی", "content": "1. تاکید لفظی\t\t2. تاکید معنوی"}, {"id": "c21t7", "title": "تاکید لفظی", "content": "تاکید لفظی: یہ تاکید تکرار لفظ کے ساتھ ہوتی ہے جیسے  زَیْدٌ زَیْدٌ قَائِمٌ ( اس مثال میں اسم  زَیْدٌ کا تکرار ہے چنانچہ یہ تاکید لفظی ہے ) ، اور دیگر مثالیں بھی ہیں جیسے   ضَرَبَ ضَرَبَ زَیْدٌ(اس مثال میں فعل کی تکرار ہے)اور اِنَّ اِنَّ زَیْدًاقَائِمٌ ( اس مثال میں حرف کی تکرار ہے)"}, {"id": "c21t8", "title": "تاکید  معنوی", "content": "تاکید  معنوی: تاکید معنوی آٹھ(8) لفظوں کے ساتھ ہوتی ہے  ،1.نَفْسٌ     2.عَیْنٌ      3.کِلَاکِلْتَا     4.کُلٌّ      5.اَجْمَعُ         6.اَکْتَعُ         7.اَبْتَعُ      8.اَبْصَعُ  ان آٹھ لفظوں میں سے کسی ایک لفظ کے ساتھ تاکید معنوی آتی ہے \n٭ جَاءنِیْ زَیْدٌ نَفْسُہٗ، زَیْدٌ (مرفوع ہے اس واسطے کے جَاءنِیْ کا فاعل ہے) ، نَفْسُہٗ (زَیْدٌ کی تاکید معنوی ہے)،تابع اور متبوع کا ایک ہی اعراب ہے \n٭ جَاءنِیْ الزَّیْدَانِ اَنْفُسَھُمَا ، زَیْدَانِ (مرفوع ہے اس واسطے کے جَاءنِیْ کا فاعل ہے)، اَنْفُسَھُمَا (زَیْدَانِ کی تاکید معنوی ہے)، تابع اور متبوع کا ایک ہی اعراب ہے\n٭ جَاءنِیْ الزَّیْدُوْنَ اَنْفُسُھُمَ،زَیْدُوْنَ (مرفوع ہے اس واسطے کے جَاءنِیْ کا فاعل ہے)، اَنْفُسُھُمَ (زَیْدُوْنَ کی تاکید معنوی ہے)\n٭ عَیْنٌ کی تاکید معنوی کا بھی یہی طریقہ ہے  \n٭ جَاءنِیْ الزَّیْدَانِ کِلَاھُمَا، زَیْدَانِ (مرفوع ہے اس واسطے کے جَاءنِیْ کا فاعل ہے)، کِلَاھُمَا(زَیْدَانِ کی تاکید معنوی ہے)اور اسی طرح جَاءنِیْ الْھِنْدَانِ کِلْتَاھُما، الْھِنْدَانِ (مرفوع ہے اس واسطے کے جَاءنِیْ کا فاعل ہے)، کِلْتَاھُما (الْھِنْدَانِ کی تاکید معنوی ہے)   \n٭ کِلَا اور کِلْتَا خاص ہیں تثنیہ کے ساتھ، کِلَا کے ساتھ  تثنیہ مذکرکی تاکید  معنوی لائی جائی گی  اور کِلْتَا کے ساتھ  تثنیہ موئنث کی تاکید معنوی لائی جائی گی  \n٭ جَاءنِیْ الْقَوْمُ کُلُّھُمْ اَجْمَعُونَ اَکْتَعُونَ اَبْتَعُوْنَ اَبْصَعُوْنَ ، الْقَوْمُ (مرفوع ہے اس واسطے کے جَاءنِیْ کا فاعل ہے)، کُلُّھُمْ (الْقَوْمُ کی تاکید معنوی ہے)   ، اَجْمَعُونَ(الْقَوْمُ کی تاکید معنوی ہے)   ، اَکْتَعُونَ (الْقَوْمُ کی تاکید معنوی ہے)   ،اَبْتَعُوْنَ(الْقَوْمُ کی تاکید معنوی ہے)    ،اَبْصَعُوْنَ(الْقَوْمُ کی تاکید معنوی ہے)"}, {"id": "c21t9", "title": "جان تو جو اَکْتَعُ ،اَبْتَعُ ،اَبْص…", "content": "جان تو جو اَکْتَعُ ،اَبْتَعُ ،اَبْصَعُ تابع ہیں ساتھ اَجْمَعُ کے اور بغیر اَجْمَعُ کے نہیں آتےاوراَجْمَعُ سے پہلے بھی نہیں آتےاور اَجْمَعُ کے بعد ان کو ذکر کیا جاتا ہے"}, {"id": "c21t10", "title": "جَاءنِیْ الْقَوْمُ کُلُّھُمْ اَکْتَ…", "content": "جَاءنِیْ الْقَوْمُ کُلُّھُمْ اَکْتَعُونَ اَبْتَعُوْنَ اَبْصَعُوْنَ اَجْمَعُونَ ،یہ کہنا غلط ہوگا\n3.                                             بدل:  وہ تابع ہے جو مقصود ساتھ نسبت کے وہی ہو،بدل کی چار قسمیں ہیں \t1.بَدَلُ الکُلْ     2.بَدَلُ الْبَعْض    3.بَدَلُ الْاِشْتِمَالْ      4.بَدَلُ الْغَلَطْ"}, {"id": "c21t11", "title": "بَدَلُ الکُلْ", "content": "بَدَلُ الکُلْ: وہ بدل ہے جو اس کا مدلول مُبْدَلْ مِنْہُ کا مدلول ہو،جس طرح پہلے ذکر گزرا کہ متبوع پہلے لفظ ہوتا تھا اور تابع دوسرا ،یہاں مُبْدَلْ مِنْہُ پہلا لفظ ہوگا اور مدلول دوسرا اور اس طرح بَدَلْ  اور مُبْدَلْ مِنْہُ کا ایک ہی اعراب ہوتا ہے \n٭جیسے جاءَنِیْ زَیْدٌ اَخُوْکَ  (آیا میرے پاس زید بھائی تیرا)، یہاں جاءَنِیْ(فعل) کے بعد دو لفظ ہیں ایک ہے  زَیْدٌدوسرا لفظ ہے  اَخُوْکَ  ،یہاں زَیْدٌ  کو مُبْدَلْ مِنْہُ کہیں گے اور اَخُوْکَ کو بَدَلْ کہیں گے یعنی بَدْلُ الکُلْ، یہاں زَیْدٌ کا مدلول زَیْدٌ کی پوری ذات سر سے لیکر پاؤں تک ہے اور اَخُوْکَ بَدْلُ الکُلْ  ہےاور اس کا مدلول بھی وہی زَیْدٌ کی ذات  ہے، تو اَخُوْکَ پر  بَدْلُ الکُلْ کی تعریف صادق آتی ہے \n٭ مُبْدَلْ مِنْہُ لفظ ہوتا ہے دلالت کرنے والا\n٭مدلول جس پر لفظ صادق آئے اس کو مدلول کہتے ہیں  جیسے زید ایک لفظ ہے یہ اس شخص پر سچا آتا ہے جس شخص کا نام زید ہے ۔یہاں لفظ زید دَالْ(دلالت کرنے والا)،اس کا مدلول ہے زید کی ذات یعنی زید خود اس کا مدلول ہے"}, {"id": "c21t12", "title": "بَدْلُ الْبَعْض", "content": "بَدْلُ الْبَعْض: وہ بدل ہے جو اس کا مدلول مُبْدَلْ مِنْہُ کا جز ہو\n٭ ضُرِبَ زَیْدٌ رأْسُہٗ(مارا گیا زیدسر اس کا) ،ضُرِبَ (فعل)، زَیْدٌ( مرفوع ہے اس  لئے کہ ضُرِبَ کا نائب فاعل ہے)رَأْسُ (مضاف)، ہٗ (ضمیر مضاف الیہ) \n٭ یہاں زَیْدٌ کا مدلول زَیْدٌ کی پوری ذات سر سے لیکر پاؤں تک ہے اور مُبْدَلْ مِنْہُ ہے ،اور رأْسُہٗ  کا مدلول زَیْدٌ کی ایک جز  یعنی اس کا سر ہےتو  رَأْسُہٗ  بَدْلُ الْبَعْض ہے"}, {"id": "c21t13", "title": "بَدَلُ الْاِشْتِمَالْ", "content": "بَدَلُ الْاِشْتِمَالْ: وہ بدل ہے جو اس کا مدلول مُبْدَلْ مِنْہُ کے ساتھ تعلق پکڑنے والا ہو\n٭جیسے صُلِبَ زَیْدٌ ثَوْبُہٗ ( کھینچا گیا زید کپڑا اس کا) ، ضُرِبَ (فعل )، صُلِبَ ( مرفوع ہے اس  لئے کہ صُلِبَ کا نائب فاعل ہے)، ثَوْبُ(مضاف)، ہٗ (ضمیر مضاف الیہ)\n٭ یہاں زَیْدٌ کا مدلول زَیْدٌ کی پوری ذات سر سے لیکر پاؤں تک ہے اور مُبْدَلْ مِنْہُ ہے ، ثَوْبُہ ٗبَدَلُ الْاِشْتِمَالْ ہے\n٭ ثَوْبُہٗ  کا مُبْدَلْ مِنْہُ  ہے زَیْدٌ اور ثَوْبُہٗ کا مدلول کپڑا ہے اور یہ کپڑا مُبْدَلْ مِنْہُ(زَیْدٌ) کے ساتھ تعلق رکھتا ہے،کپڑے کا تعلق زید کے ساتھ ملکیت اور مملوکیت کا ہے یعنی زید مالک ہے اور کپڑا مملوک ہے"}, {"id": "c21t14", "title": "بَدَلُ الْغَلَطْ", "content": "بَدَلُ الْغَلَطْ: وہ بدل ہے جو غلطی کے بعددوسرے لفظ کے ساتھ یاد کریں \n٭ مَرَرْتُ بِرَجُلٍ حِمَارٍ  (گزرا میں ساتھ مرد گدھے کے )،یہاں بِرَجُلٍ مُبْدَلْ مِنْہُ ، حِمَارٍ بَدَلُ الْغَلَطْہے\n٭یہاں بولنے میں انسان کو غلطی لگی کیوں وہ بولنا تو چاہتا تھا کہ مَرَرْتُ بِحِمَارٍ لیکن اس نے بو ل دیا مَررَتُ بِرَجُلٍ،یہاں حِمَارٍ غلطی کا بدل ہے یعنی بَدَلُ الْغَلَطْہے\n٭ پہلی بات غلط ہوتی ہے اور دوسری بات غلطی کا بدلہ ہوتی ہے اور دوسری بات کو بَدَلُ الْغَلَطْکہیں گے"}, {"id": "c21t15", "title": "عطف بحرف(عطف نسق)", "content": "عطف بحرف(عطف نسق): وہ تابع ہے جو مقصود ہو ساتھ نسبت کے اپنے متبوع  سمیت  حرف عطف کے بعد \n٭جیسے  جَاءَنِیْ زَیْدٌ و عَمْرٌو،واؤ حرف عاطفہ ہے ،  عَمْرٌو تابع ہےحرف عطف کا(تابع حرف عاطفہ کے بعد واقع ہوتا ہے)  اور اس کا متبوع زَیْدٌ ہے، \n٭جَاءَنِیْ(فعل) اس کی نسبت ہے آگے زَیْدٌ (فاعل ) کی طرف ،اس نسبت سے زَیْدٌ بھی مقصود ہے اور عَمْرٌو بھی مقصود ہے  یعنی دونوں مقصود ہیں \n٭ حرف عطف کے کُل دس(10) ہیں اس کا بیان آخر

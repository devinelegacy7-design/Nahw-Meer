میں ہوگا"}, {"id": "c21t16", "title": "عطف بیان", "content": "عطف بیان: وہ تابع ہے  جو صفت نا ہو اپنے متبوع کو روشن کرے \n٭ اَقْسَمَ بِاللہِ اَبُوْ حَفْصٍ عُمَرُ( قسم کھائی اللہ کی ابو حفص عمر نے) ، یہاں عطف بیان عُمَرُ ہوگا، عطف بیان کی تعریف عُمَرُ پر سچی آرہی ہے کیونکہ عُمْر نے اپنے متبوع اَبُوْ حَفَصْ کو ظاہر کردیا \n٭امیر المومنین سسر مصطفیٰ داماد علی  حضرت سیدنا عمر فاروق رضی اللہ تعالیٰ عنہ  آپ کی کنیت ابو حفص ہے ، نام ان کا عمر ہے اب ان (نام و کنیت) میں جو زیادہ مشہور ہوگا ان کی عطف بیان  وہی بنے گا \n٭ کنیت وہ لفظ ہوتا ہے جس کی ابتداء میں ابو ہو یا ابن ہویا ام ہو یا بنت ہو جیسے ابن مسعود،ابن عباس اور ابن عمر رضی اللہ عنہم\n٭جَاءَنِیْ زَیْدٌ اَبُو عَمْرٍ و، یہاں اَبُوْعَمْرٍ عطف بیان ہے  کیونکہ یہ اصل نام سے زیادہ مشہور ہےاور زَیْدٌ متبوع ہے"}, {"id": "c21t17", "title": "فصل دوسری منصرف و غیر منصرف میں", "content": "فصل دوسری منصرف و غیر منصرف میں"}, {"id": "c21t18", "title": "منصرف", "content": "منصرف :وہ اسم  ہوتا ہے جو کوئی سبب منع صرف کے اسباب میں سے اس میں نا ہو"}, {"id": "c21t19", "title": "غیر منصرف", "content": "غیر منصرف:  وہ اسم ہے جو منع صرف کے  جو دو اسباب یا ایک سبب  ایسا جو منع صرف کے دو اسباب کے قائم مقام ہو اس میں ہو \n٭ دو اسباب کے قائم مقام  تین  اسباب ہیں                                                                        1.جمع منتہی الجموع                                                        2.الف مقصورہ برائے تانیث                                3. الف  ممدودہ \n٭ غیر منصرف کا حکم یہ ہے کہ اس پر کسرہ اور تنوین نہیں آتی اور منصرف کا حکم یہ ہے اس پر کسرہ بھی آتا ہے اور تنوین بھی آتی ہےاسباب   منع صرف کے نو (9)اسباب ہیں ۔اب جس اسم میں ان نو(9) اسباب میں سے دو اس  میں پائے جائیں گے وہ اسم غیر منصرف بن جائے گا\n1. عدل                2.وصف                   3.تانیث               4.معرفہ                         5.عجمہ                     6.جمع                            7.ترکیب                         8.وزن فعل        9.الف نون زائدتان"}, {"id": "c21t20", "title": "جیسے عُمَرُ ،اس میں اسباب منع صرف م…", "content": "جیسے عُمَرُ ،اس میں اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک عدل ہے اوردوسراعَلم (معرفہ) ہے  ،اس واسطے عُمَرُ غیر منصرف ہے"}, {"id": "c21t21", "title": "ثُلٰثُ وَمَثْلَثُ ، اس میں  بھی اسب…", "content": "ثُلٰثُ وَمَثْلَثُ ، اس میں  بھی اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک صفت ہے اور  دوسرا  عدل ہے، اس واسطے ثُلٰثُ وَمَثْلَثُ غیر منصرف ہے"}, {"id": "c21t22", "title": "طَلْحَۃُ، یہ اسم ہے اس میں  بھی اسب…", "content": "طَلْحَۃُ، یہ اسم ہے اس میں  بھی اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک تانیث لفظی ہے یعنی اسم کے آخر میں \"ۃ\" ہے اور دوسرا سبب عَلم (معرفہ) ہے، اس واسطے طَلْحَۃُ غیر منصرف ہے"}, {"id": "c21t23", "title": "زَیْنَبُ یہ بھی اسم ہے، اس میں  بھی…", "content": "زَیْنَبُ یہ بھی اسم ہے، اس میں  بھی اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک تانیث معنوی اور دوسرا سبب عَلم (معرفہ) ہے، اس واسطے زَیْنَبُ غیر منصرف ہے"}, {"id": "c21t24", "title": "حُبْلیٰ، اس میں منع صرف کا ایسا سبب…", "content": "حُبْلیٰ، اس میں منع صرف کا ایسا سبب پایا گیا ہے جو سبب منع صرف کے دو اسباب کے قائم مقام ہے ، اور وہ سبب الف مقصورہ ہے ، اس واسطے حُبْلیٰ غیر منصرف ہے"}, {"id": "c21t25", "title": "حَمَرَآءُ، اس میں منع صرف کا ایسا …", "content": "حَمَرَآءُ، اس میں منع صرف کا ایسا سبب پایا گیا ہے جو سبب منع صرف کے دو اسباب کے قائم مقام ہے ، اور وہ سبب تانیث ساتھ  بالف ممدودہ  ہے، اس واسطے حَمَرَآءُ غیر منصرف ہے"}, {"id": "c21t26", "title": "اِبْرَاہِیْمُ، اس میں  بھی اسباب من…", "content": "اِبْرَاہِیْمُ، اس میں  بھی اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک عجمہ ہے اور دوسرا عَلم ہے، اس واسطے اِبْرَاہِیْمُ غیر منصرف ہے"}, {"id": "c21t27", "title": "مَسَاجِدُ اور مَصَا بِیْحُ، ان میں …", "content": "مَسَاجِدُ اور مَصَا بِیْحُ، ان میں منع صرف کا ایسا سبب پایا گیا ہے جو سبب منع صرف کے دو اسباب کے قائم مقام ہے اور وہ سبب جمع منتہی الجموع ہے، اس واسطے مَسَاجِدُ اور مَصَا بِیْحُ غیر منصرف ہیں"}, {"id": "c21t28", "title": "بَعْلَبَکُّ، اس میں  بھی اسباب منع …", "content": "بَعْلَبَکُّ، اس میں  بھی اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک ترکیب ہے اور دوسرا عَلم ہے،اس واسطے بَعْلَبَکُّغیر منصرف ہے"}, {"id": "c21t29", "title": "اَحْمَدُ، اس میں  بھی اسباب منع صرف…", "content": "اَحْمَدُ، اس میں  بھی اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک وزن فعل ہے اور دوسرا عَلم ہے،اس واسطے اَحْمَدُ غیر منصرف ہے"}, {"id": "c21t30", "title": "سَکْرَانُ، اس میں  بھی اسباب منع صر…", "content": "سَکْرَانُ، اس میں  بھی اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک الف نون زائدتان ہے اور دوسرا وصف ہے، اس واسطے سَکْرَانُ غیر منصرف ہے"}, {"id": "c21t31", "title": "عُثْمَانُ، اس میں  بھی اسباب منع صر…", "content": "عُثْمَانُ، اس میں  بھی اسباب منع صرف میں سے دو اسباب پائے گئے ہیں ایک الف نون زائدتان ہے اور دوسرا علم  ہے، اس واسطے عُثْمَانُ غیر منصرف ہے"}, {"id": "c21t32", "title": "تیسری فصل حروف غیر عاملہ کے بیان می…", "content": "تیسری فصل حروف غیر عاملہ کے بیان میں اور وہ سولہ (16) ہیں"}, {"id": "c21t33", "title": "یہ ایسے حروف ہیں جو کوئی عمل نہیں ک…", "content": "یہ ایسے حروف ہیں جو کوئی عمل نہیں کرتے نا اسم کو رفع دیتے نا فعل کو نصب دیتے  اور نا اس کے بر عکس"}, {"id": "c21t34", "title": "حروف تنبیہ", "content": "حروف تنبیہ: تنبیہ کا مطلب ہوتا ہے متکلم کا مخاطب کو خبردار کرنا  ، حروف تنبیہ کے تین ہیں     1.اَلَا    2.اَمَا   3.ھَا\n٭ جیسے کہ قرآن مجید میں اللہ تعالیٰ ارشاد فرماتا ہے اَلَا اِنَّ اَوْلِیَاءَ اللہِ لَا خَوْفٌ عَلَیْہِمْ وَلَا ھُمْ یَحْزَنُوْنَ  (خبردار ! بیشک ا للہ کے ولیوں پر نہ کچھ خوف ہوگا اور نہ وہ غمگین ہوں گے)،اس مثال میں اَلَا حرف تنبیہ کا ہے"}, {"id": "c21t35", "title": "حروف ایجاب", "content": "حروف ایجاب: ایجاب کا معنی ہوتا ہے جواب دینا ،حروف ایجاب چھ (6) ہیں                                           1.نَعَمْ    2.بَلیٰ     3.اَجَلْ    4.اِیْ      5.جَیْرِ    6.اِنَّ\n٭ اِنَّ حروف ایجاب میں سے ہو تو عمل نہیں کرتا ،اگر حروف مشبہ بالفعل میں سے ہو تو عمل کرتا ہے"}, {"id": "c21t36", "title": "حروف تفسیر", "content": "حروف تفسیر: دو حروف تفسیر کے ہیں \t1.اَیْ     2.اَنْ\n٭جیسے کہ اللہ تعالیٰ قرآن کریم میں ارشاد فرماتا ہے وَ نَادَیْنٰهُ اَنْ یّٰۤاِبْرٰهِیْمُ (اور ہم نے اسے ندا فرمائی یعنی اے ابراہیم)، یہاں اَنْ حروف تفسیر میں سے ہے اور اس  کا معنی یعنی والا ہوگا"}, {"id": "c21t37", "title": "حروف مصدریہ", "content": "حروف مصدریہ: وہ حروف تین ہیں \t1.مَا   2.اَنْ    3.اَنَّ \n٭ مَا اور اَنْ فعل میں داخل ہوتے ہیں اور فعل کو مصدر کے معنی میں بنا دیتے ہیں اس واسطے ان کو حروف مصدریہ کہتے ہیں"}, {"id": "c21t38", "title": "حروف تحضیض", "content": "حروف تحضیض :  تحضیض کا معنی ہوتا  ہے کسی کو کسی کام پر ابھارنا یا اکسانایعنی ان حروف سے متکلم مخاطب کو کسی کام پر ابھارتا یا اکساتا ہے  ، یہ حروف چار ہیں                                    1.اَلَّا    2.ھَلَّا    3.لَوْلَا    4.لَوْمَا"}, {"id": "c21t39", "title": "حرف توقع", "content": "حرف توقع : توقع کا معنی ہوتا ہے امید  ہوتاہے ،اور وہ قَدْ ہے \n٭ قَدْ اگر ماضی پر داخل ہو جائے تو قَدْ تحقیق کے معنی کے ساتھ ہوگا اور اس ماضی کو حال کے قریب کردے گا  جیسے قَدْ اَفْلَحَ الْمُؤْمِنُوْنَ (تحقیق  ایمان والے کامیاب ہوگئے)،یہاں قَدْ تحقیق والا معنی بھی دے رہا ہے اور زمانہ حال کا معنی بھی دے رہا ہے\n٭ اگر قَدْ مضارع پر داخل ہوجائے تو   قلت کا معنی دے گا جیسے قَدْ نَرٰى تَقَلُّبَ وَجْهِكَ فِی السَّمَآءِ(کبھی کبھی دیکھتے ہیں ہم آپ کے پھرنے چہرے کو آسمان میں) ، قَدْ داخل ہوا نَرٰی پر تو قَدْ نے  مضارع کو قلت کے معنی میں کردیا"}, {"id": "c21t40", "title": "حروف استفہام", "content": "حروف استفہام: وہ تین حروف ہیں \t1.مَا    2.ہمزہ    3.ھَلْ"}, {"id": "c21t41", "title": "حرف ردع", "content": "حرف ردع: ردع کا معنی ہوتا ہے روکنا یا واپس پھیرنا  اور حقًا (یقین)کے معنی کے ساتھ بھی آیا ہے\nحرف ردع کا ایک  حرف ہے \t1.کَلَّا\n٭ جیسے کہ اللہ تعالیٰ قرآن کریم میں ارشاد فرماتا ہے کَلَّا سَوْفَ تَعْلَمُوْنَ(یقینًا  جان لو گے تم )"}, {"id": "c21t42", "title": "تنوین", "content": "تنوین :نون تنوین کا وہ نون ہوتا ہے جو کلمے کی آخری حرکت کے تابع ہو  ،تنوین کی پانچ قسمیں ہیں"}, {"id": "c21t43", "title": "تنوین تمکن", "content": "تنوین تمکن :یہ وہ تنوین ہوتی ہے جو اسم کے معرب ہونے پر دلالت کرے\n٭ جیسے زَیْدٌ ، زَیْدٌ پر جو تنوین ہے  وہ زَیْدٌ کے معرب ہونے پر دلالت کر رہی ہے"}, {"id": "c21t44", "title": "تنوین تنکیر", "content": "تنوین تنکیر: یہ وہ تنوین ہوتی ہے جو اسم کے نکرہ ہونے پر دلالت کرے\n٭ جیسےصَہٍ اسم فعل کا صیغہ ہے اور مبنی ہے اس کا معنی ہوگا اُسْکُتْ سُکُوْتًا مَّا فِیْ وَقْتٍ مَّا ( چپ کر تو چپ کرنا کچھ کسی وقت میں ) اور اگر صَہْ ہو یعنی بغیر تنوین کے ہوتو اس کا معنی ہوگا اُسْکُتِ السُّکُوْ تَ الْاٰنَ (چپ کر تو چپ کرنا ابھی )"}, {"id": "c21t45", "title": "تنوین عوض", "content": "تنوین عوض:وہ تنوین ہوتی ہے جو مضاف الیہ کو  حذف  کر نے کے اس کے بدلے میں  مضاف کو دی جاتی ہے جیسے  یَوْمَىٕذٍ اس مثال میں جو تنوین ہے وہ عوض کی ہے\n٭ اصل میں عبارت یوں تھی یَوْ مَ اِذَا کَانَ کَذَا ، کَانَ کَذَا مضاف الیہ تھا اس کو حذف کیا گیا اس کے بدلے میں یَومَ اِذَجو مضاف تھااس پر تنوین لا دی گئی ہے مضاف الیہ کے بدلے میں تو یَوْمَىٕذٍ بن گیا"}, {"id": "c21t46", "title": "تنوین مقابلہ", "content": "تنوین مقابلہ: وہ تنوین ہوتی ہے جو جمع موئنث سالم کے صیغہ پر جمع مذکر سالم  کے نون کے مقابلے میں آتی ہے\n٭  جیسے مُسْلِمَاتٍ  یہ جمع موئنث سالم کا صیغہ ہے اور اس کے آخر میں جو تنوین ہے وہ تنوین جمع مذکر سالم کے نون کے مقابلے میں آتی ہے جیسے مُسْلِمُوْنَ"}, {"id": "c21t47", "title": "تنوین ترنم", "content": "تنوین ترنم :وہ تنوین ہوتی ہے جوآواز کی خوبصورتی کے لئے  اشعار کے مصروں کے آخر میں  آتی ہے\n٭ جیسے اَقَلِّی الَّوْمَ عَا ذِلَ وَالْعِتَابَنْ\tوَقُوْلِیْ اِنْ اَصَبْتُ لَقَدْ اَصَابَنْ     اس مثال میں مصروں کے  آخر میں نون تنوین کا ہے ، تنوین ترنم کا اسم پر  بھی آتا ہے اور فعل پر بھی آتا ہے\n٭ تنوین ترنم کا اسم ،فعل اور حرف پر داخل ہوسکتا ہے بہر حال تنوین تمکن ،تنوین تنکیر ، تنوین عوض اور تنوین مقابلے کا خاص ہیں  اسم کے ساتھ"}, {"id": "c21t48", "title": "نون تاکید", "content": "نون تاکید : حروف غیر عاملہ کی دسویں قسم ہے نون تاکید کا فعل مضارع کے آخر میں آتا ہے  چاہے وہ خفیفہ کا ہو یا ثقیلہ کا ہو \n٭ نون تاکید ثقیلہ کی مثال ہے اِضْرِبَنَّ  اور نون تاکید خفیفہ کی مثال ہے اِضْرِبَنْ ، نون تاکید کا چاہے ثقیلہ کا ہو یا خفیفہ کا اسم اور فعل میں کوئی عمل نہیں کرتا"}, {"id": "c21t49", "title": "حروف زیادت (حروف زوائد )", "content": "حروف زیادت (حروف زوائد ):  یہ قسم آٹھ (8) حروف پر مشتمل ہے \t1.اِنْ    2.اَنْ     3.مَا     4.لَا    5.مِنْ    6.کاف    7.بَا     8.لام\tان میں سے آخری چار کو حروف جارہ میں بھی یاد کیا گیا تھا"}, {"id": "c21t50", "title": "حروف شرط", "content": "حروف شرط: اور وہ دو حروف ہیں \t1.اَمَّا    2.لَوْ\t\n٭ اَمَّا تفسیرکے لئے ہوتی ہے اور فاءکو اس کے جواب میں لانا  لازم ہوتا ہے  جیسے فَمِنْهُمْ شَقِیٌّ وَّ سَعِیْدٌ فَاَمَّا الَّذِیْنَ شَقُوْا فَفِی النَّارِ  وَ اَمَّا الَّذِیْنَ سُعِدُوْا فَفِی الْجَنَّةِ  (تو ان میں کوئی بدبخت ہوگا اور کوئی خوش نصیب ہوگاتو جو بدبخت ہوں گے وہ تو دوزخ میں ہوں گے، اور وہ جو خوش نصیب ہوں گے وہ جنت میں ہوں گے)،اس مثال میں اَمَّا                   شقی اور سعید کی تفسیر کے لئے ہے اور فَفِی النَّارِ  ، فَفِی الْجَنَّةِ  پر جو فاء ہے اس   فاء کو اَمَّا  کے جواب میں لایا گیا ہے \n٭ لَوْ کو استعمال کیا جاتا ہے واسطے نا ہونے دوسری چیز کے بسبب نا ہونے پہلی چیز ہےجیسے لَوْ كَانَ فِیْهِمَاۤ اٰلِهَةٌ اِلَّا اللّٰهُ لَفَسَدَتَا (اگر آسمان و زمین میں اللہ کے سوا اورمعبود ہوتے تو ضرور آسمان و زمین تباہ ہوجاتے ) ،یہاں پر دوسری چیز لَفَسَدَتَا(تباہ ہوجاتے )ہے اور وہ نہیں ہائی گئی کیوں کہ پہلی چیز لَوْ كَانَ فِیْهِمَاۤ   اٰلِهَةٌ اِلَّا اللّٰهُ  (اگر آسمان و زمین میں اللہ کے سوا معبود ہوتے)  نہیں پائی گئی"}, {"id": "c21t51", "title": "لَوْلَا", "content": "لَوْلَا:اور وہ بنایا گیا ہے واسطے نا ہونے دوسری چیز بسبب پائے جانے پہلی چیز کے \n٭ جیسے لَوْلَا عَلْیٌّ لَھَلَکَ عُمَرُ (اگر نا ہوتے علی البتہ ہلاک ہوجاتے عمر)، اس مثال میں دوسری چیز  لَھَلَکَ عُمَرُ(البتہ ہلاک ہوجاتے عمر) نہیں پائی گئی کیونکہ پہلی چیز لَوْلَا عَلْیٌّ( اگر نا ہوتے علی) پائی گئی ہے ،یعنی دوسری چیز ہے ہلاکت عمر اور وہ نہیں پائی گئی کیونکہ پہلی چیز وجود علی پایا گیا ہے"}, {"id": "c21t52", "title": "لام مفتوحہ برائے تاکید", "content": "لام مفتوحہ برائے تاکید: جیسے لَزَیْدٍ اَفْضَلُ مِنْ عَمْرٍو (  البتہ زید افضل ہے عمرو سے )\n٭ لَزَیْدٍ پر جو ہے یہ لام مفتوحہ واسطے تاکید  کے ہے اور اسم اور فعل پر کوئی عمل نہیں کرتا"}, {"id": "c21t53", "title": "مَا ساتھ معنی  مَادَامَ کے", "content": "مَا ساتھ معنی  مَادَامَ کے: جیسے اَقُوْمُ مَا جَلَسَ الْاَمِیْرُ ( کھڑا ہوں میں جب تک کہ  بیٹھا بادشاہ ) \n٭ اس مثال میں مَا حروف غیر عاملہ کی پندرہویں کی قسم ہے اور مَادَامَ کے معنی کے ساتھ ہے اور اسم اور فعل پر کوئی عمل نہیں کرتی ، دَامَ کا معنی (جب تک کہ )"}, {"id": "c21t54", "title": "حروف عطف", "content": "حروف عطف: حروف عطف کے دس (10)  ہیں    \t1.و   2.فا    3.ثُمَّ    4.حَتّٰی   5.اِمَّا     6.اَوْ     7.اَمْ     8.لَا     9.بَلْ      10.لٰکِنْ \n٭ یہ دس حروف بھی اسم اور فعل میں کوئی عمل نہیں کرتے"}, {"id": "c21t55", "title": "مستثنیٰ", "content": "مستثنیٰ : وہ اسم ہوتا ہے  جو اِلَّا اور اس جیسے دیگر الفاظ کے بعد واقع ہو، تا کہ معلوم ہوجائے جو حکم اِلَّا یا اس  جیسے دوسرے الفاظ کے  ماقبل کی طرف منسوب ہے مستثنیٰ  کی طرف منسوب نہیں ہے"}, {"id": "c21t56", "title": "٭ اِلَّا کی اخوات (بہنیں)  یعنی اس …", "content": "٭ اِلَّا کی اخوات (بہنیں)  یعنی اس جیسے دوسرے الفاظ دس(10) ہیں \t1.غَیْرَ     2.سِوٰی    3.سَوَاءَ     4.حَاشَا     5.خَلَا    6.عَدَا     7.مَا خَلَا      8.مَا عَدَا      9.لَیْسَ    10.لَا یَکُونُ"}, {"id": "c21t57", "title": "٭اِلَّا کے ما قبل کو مستثنیٰ منہ کہ…", "content": "٭اِلَّا کے ما قبل کو مستثنیٰ منہ کہتے ہیں اور اِلَّا کے ما بعدکو مستثنیٰ کہتے ہیں"}, {"id": "c21t58", "title": "٭مستثنیٰ منہ اور مستثنیٰ ہونا اسم ک…", "content": "٭مستثنیٰ منہ اور مستثنیٰ ہونا اسم کا خاصہ ہے ،حرف اور فعل نا مستثنیٰ منہ ہوسکتے ہیں نا مستثنیٰ ہوسکتے ہیں"}, {"id": "c21t59", "title": "٭ جیسے جَاءنِی الْقَوْمُ اِلَّا زَی…", "content": "٭ جیسے جَاءنِی الْقَوْمُ اِلَّا زَیْدً(آئی میرے پاس قوم مگر زید)، اِلَّا کے بعد اسم ہے زَیْدً اس کو مستثنی ٰ  کہیں گے اور اِلَّا سے پہلے الْقَوْمُ  ہے اس کو مستثنیٰ منہ کہیں گے، جَاءَنِیْ کی  نسبت قوم کی طرف ہے لیکن زید کی طرف نہیں ہے"}, {"id": "c21t60", "title": "مستثنیٰ کی دوا قسام ہیں \t1.مستثنیٰ …", "content": "مستثنیٰ کی دوا قسام ہیں \t1.مستثنیٰ متصل   \t2.مستثنیٰ منقطع"}, {"id": "c21t61", "title": "مستثنیٰ متصل", "content": "مستثنیٰ متصل: وہ مستثنیٰ ہے جو خارج کیا جائے متعدد (بہت ساری چیزیں ) سے لفظ اِلَّا یا اس کے اخوات کے ساتھ\n٭ جیسے جَاءنِی الْقَوْمُ اِلَّا زَیْدً(آئی میرے پاس قوم مگر زید)، اب زَیْدً میں جو مستثنیٰ ہے اس کو مستثنیٰ متصل کہیں گے کیوں کہ زید کو  متعدد سے نکالا گیا ،قوم میں متعدد افراد ہوتے ہیں  تو زَیْدً کو قوم سے نکالا گیا اِلَّا کے لفظ کے ساتھ \n٭ اسی طرح اِلَّا کی اخوات کے ساتھ بھی زَیْدً کو خارج کرسکتے ہیں جیسے جَاءنِی الْقَوْمُ غَیْرَ زَیْدٍ اور اسی  طرح دیگر اخوات  کے ساتھ بھی خارج کر سکتے ہیں \n٭ پس زید جو قوم میں داخل تھا ،آنے کے حکم سے خارج کیا گیا ہے"}, {"id": "c21t62", "title": "مستثنیٰ     منقطع", "content": "مستثنیٰ     منقطع:  وہ مستثنیٰ  ہوتا ہےجو اِلَّا کے بعد  مذکور ہو یا اس کے اخوات کے بعد مذکور ہو  اور خارج نا کیا جائے متعدد سے بسبب  اس کے جو مستثنیٰ داخل نہیں ہوتا مستثنیٰ منہ میں \n٭ جیسے جَاءنِی الْقَوْمُ اِلَّا حِمَارًا (آئی میرے پاس قوم مگرگدھا)، اب حِمَارًا میں جو مستثنیٰ ہے اس کو مستثنیٰ      منقطع کہیں گے کیوں کہ گدھے کو متعدد سےنہیں نکالا گیا، گدھا قوم میں داخل نہیں ہے"}, {"id": "c21t63", "title": "جان تو  مستثنیٰ کے اعراب کی  چار قس…", "content": "جان تو  مستثنیٰ کے اعراب کی  چار قسمیں ہیں"}, {"id": "c21t64", "title": "پہلی قسم یہ ہے کہ مستثنیٰ اِلَّا کے…", "content": "پہلی قسم یہ ہے کہ مستثنیٰ اِلَّا کے بعد کلام موجَب میں واقع ہو ،ایسی صورت میں مستثنیٰ ہمیشہ منصوب ہوگا اور کلام موجب وہ ہوتا ہے جو اس میں نفی بھی نا ہو  ،نہی  بھی نا ہو اور استفہام بھی  نا ہو\n٭ کلام موجب کی مثال ہے جَاءَنِی الْقَوْ مُ اِلَّا زَیْدًا،زَیْدً   مستثنیٰ ہے اور واقع ہے اِلَّا کے بعد ، مستثنیٰ کلام موجب میں واقع ہے ایسی صورت   میں مستثنیٰ منصوب  پڑھنا واجب ہوگا\n٭ اسی طرح مستثنیٰ منصوب  ہوگا اگر کلام غیر موجب میں مستثنیٰ کو مستثنیٰ منہ  پر مقدم کریں یعنی مستثنیٰ   کو پہلے لائیں اور مستثنیٰ منہ کو بعد میں لائیں  جیسے مَاجَاءَنِی اِلَّا زَیْدًا اَحَدٌ، اس مثال کلام غیر موجب ہے اور اس مثال  میں زَیْدً    مستثنیٰ ہے اور اَحَدٌ    مستثنیٰ منہ ہے\n٭  مستثنیٰ      منقطع ہمیشہ منصوب ہوگا اور اگر مستثنیٰ خَلَا اور عَدَا کے بعد مستثنیٰ واقع ہو اکثر علماء کے مذہب پر منصوب ہوگا جیسے  جَاءَنِی الْقَوْ مُ خَلَا زَیْدًا اور جَاءَنِی الْقَوْ مُ عَدَا زَیْدًا، اس مثال میں زَیْدً مستثنیٰ ہے اور منصوب ہے"}, {"id": "c21t65", "title": "مستثنیٰ کے اعراب کی دوسری قسم یہ ہے…", "content": "مستثنیٰ کے اعراب کی دوسری قسم یہ ہے کہ مستثنیٰ اِلَّا کے بعد  کلام غیر موجب میں واقع ہو اور مستثنیٰ منہ بھی مذکور ہو \n٭ ایسی صورت میں مستثنیٰ پر دو طریقوں سے اعراب پڑھنا جائز ہے ، ایک وجہ یہ کہ مستثنیٰ منصوب ہوگا استثناء کے طریقے پر جیسے کہ مَاجَاءَنِی اَحَدٌ اِلَّا زَیْدًا اور دوسری وجہ یہ کہ مستثنیٰ بدل ہوگا اپنے ما قبل سےجیسے کہ  مَاجَاءَنِی اَحَدٌ اِلَّا زَیْدٌ، اَحَدٌ مرفوع ہے  اس واسطے کہ جَاءَنِی کا فاعل ہے،  اَحَدٌ مبدل منہ ہے اور زَیْدٌ بدل ہے،مبدل منہ اور بدل کا ایک ہی اعراب ہوتا ہے"}, {"id": "c21t66", "title": "مستثنیٰ کے اعراب کی تیسری قسم یہ ہے…", "content": "مستثنیٰ کے اعراب کی تیسری قسم یہ ہے کہ مستثنیٰ مفرغ ( مستثنیٰ منہ مذکور نا ہو)ہو ،اور کلام غیر موجب میں واقع ہو \n٭ اس قسم میں مستثنیٰ کا اعراب عوامل کے اعتبار سے ہوگا ،اگر عامل رفع دینے والا ہوگا تو مستثنیٰ مرفوع ہوگا ،ا گر عامل نصب دینے والا ہوگا تو مستثنی منصوب ہوگا اور اگر عامل جر دینے والا ہوگا تو مستثنی مجرور  ہوگا\n٭ جیسے مَاجَاءَنِی اِلَّا زَیْدٌ، مَارَأَیْتُ اِلَّا زَیْدًا، مَامَرَرْتُ اِلَّا بِزَیْدٍ، اب دیکھیں اس مثال میں کہ مستثنیٰ منہ مذکور نہیں ہے اور کلام بھی غیر موجب ہے  تو اس صورت میں مستثنیٰ کا اعراب عوامل کے اعتبار سے ہوگا"}, {"id": "c21t67", "title": "مستثنیٰ کے اعراب کی چھوتی قسم یہ ہے…", "content": "مستثنیٰ کے اعراب کی چھوتی قسم یہ ہے کہ مستثنیٰ اگر بعد  غَیْرَ،سِوٰی،سِوَاءَ   کے واقع ہو تو                        مستثنیٰ کو مجرور پڑھا جائے گا جیسے جَاءَنِی الْقَوْمُ غَیْرَ زَیْدٍ، جَاءَنِی الْقَوْمُ سِوٰی زَیْدٍ، جَاءَنِی الْقَوْمُ سِوَاءَ زَیْدٍ ،اور اگر حَاشَا کے بعد مستثنیٰ واقع ہوجائے تو اکثر نحویوں کے مذہب پر اس کو بھی مجرور پڑھا جائے گا جیسے جَاءَنِی الْقَوْمُ حَاشَا زَیْدٍ ، بعض نحویوں نے نصب کو بھی جائز رکھا ہے  جیسے جَاءَنِی الْقَوْمُ حَاشَا زَیْدً"}, {"id": "c21t68", "title": "جان تو جو غَیْرَ لفظ کا اعراب وہی ہ…", "content": "جان تو جو غَیْرَ لفظ کا اعراب وہی ہوگاجو مستثنیٰ کا اعراب تھا جو مستثنیٰ اِلَّا کے ساتھ تھا،تمام مذکورہ صورتوں میں\n٭جیسا کہ مستثنیٰ بعد اِلَّا کے کلام موجَب میں واقع ہو تو                    مستثنیٰ ہمیشہ منصوب ہوتا ہے تو غَیْرَ بھی منصوب ہوگا جیسےکہ  جَاءَنِی الْقَوْمُ غَیْرَ زَیْدٍ\n ٭ مستثنیٰ                   منقطع  میں بھی مستثنیٰ ہمیشہ منصوب ہوتا ہے تو غَیْرَ بھی منصوب ہوگا جیسے کہ جَاءَنِی الْقَوْمُ غَیْرَ حِمَارٍ\n٭  کلام غیر موجب میں اگر    مستثنیٰ کو  مستثنیٰ منہ پر مقدم کریں تو                         مستثنیٰ ہمیشہ منصوب ہوتا ہے تو غَیْرَ بھی منصوب ہوگا جیسےکہ مَاجَاءَنِی اِلَّا زَیْدَنِ الْقَوْمُ\n ٭  اگر مستثنیٰ بعد اِلَّا کے کلام غیر موجَب میں واقع ہو  اور مستثنیٰ منہ بھی مذکور ہوتو  اس میں مستثنیٰ کے اعراب کی  دو وجہ پڑھنا جائز ہے تو غَیْرَ کے اعراب کی بھی وجہ پڑھی جائیں گی جیسے کہ مَاجَاءَنِی اَحَدٌغَیْرَ زَیْدًا اور   مَاجَاءَنِی اَحَدٌ غَیْرُ زَیْدًا\n٭    اگر کلام غیر موجَب ہو اور مستثنیٰ منہ مذکور نا ہو تو                     مستثنیٰ کا اعراب عوامل کی کے موافق ہوگا   تو غَیْرَکا اعراب بھی عوامل کی حرکت کے مطابق آئے گا جیسے کہ مَاجَاءَنِی غَیْرُ زَیْدٌ، مَارَأَیْتُ غَیْرَ زَیْدًا، مَامَرَرْتُ بِغَیْرِ بِزَیْدٍ\n\nجان تو جو لفظِ غَیْرَ  واسطے صفت کے بنایا گیا ہے اور کبھی استثناء کے معنی میں بھی  آتا ہے ، جیسا کہ اِلَّا کو واسطے استثناء کے بنایا گیا اور کبھی صفت کے معنی میں بھی استعمال ہوتا ہے \n٭جیسے لَوْ كَانَ فِیْهِمَاۤ اٰلِهَةٌ اِلَّا اللّٰهُ لَفَسَدَتَا (اگر آسمان و زمین میں اللہ کے سوا اورمعبود ہوتے تو ضرور آسمان و زمین تباہ ہوجاتے )  یہاں اِلَّا  کا معنی صفت والا کر رہے ہیں  (یعنی اگر ہوتے  ایسے خدا تو جو اللہ کے سوا ہیں)، اگر یہاں ہم معنی استثناء کا کریں تو وہ یوں بنے گا( اگر ہوتے آسمان و زمین میں معبود مگر اللہ ) ، یہاں اِلَّا ساتھ معنی غَیْرَ کے ہے \n٭اور بھی اسی طرح  لَا اِلٰہَ اِلَّا اللہُ میں اِلَّا کا معنی استثناء والا کریں گے تو معنی ہوگا(            نہیں کوئی معبود مگر اللہ تعالیٰ)"}]}];
let curC = 0, curT = null;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const ARABIC_DIACRITIC = /[\u064B-\u0652\u0670\u06D6-\u06ED]/;
function renderMixed(text){
  return text.split(/(\s+)/).map(tok=>{
    if(!tok) return '';
    if(/^\s+$/.test(tok)) return tok;
    const e = esc(tok);
    return ARABIC_DIACRITIC.test(tok) ? '<span class="ar">'+e+'</span>' : e;
  }).join('');
}
function hl(text,q){
  if(!q) return esc(text);
  try{
    const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    return esc(text).replace(re,'<mark>$1</mark>');
  }catch(e){return esc(text);}
}
function showToast(msg, isErr){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('err', !!isErr); t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 1800);
}
function copyText(text, label){
  const fallback = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok) showToast(label); else showToast('⚠ کاپی نہیں ہو سکی، دوبارہ کوشش کریں', true);
    }catch(e){ showToast('⚠ کاپی نہیں ہو سکی، دوبارہ کوشش کریں', true); }
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>showToast(label)).catch(fallback);
  } else { fallback(); }
}
function chapterPlainText(c){
  let out = 'نحو میر\n\nباب: ' + c.title + '\n\n';
  c.topics.forEach(t=>{ out += 'موضوع: ' + t.title + '\n\n' + t.content.trim() + '\n\n'; });
  return out.trim();
}
function topicPlainText(t){ return t.title + '\n\n' + t.content.trim(); }

function toggleSidebar(){ document.getElementById('sidebar').classList.contains('open') ? closeSidebar() : openSidebar(); }
function openSidebar(){
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
  document.getElementById('menuBtn').setAttribute('aria-expanded','true');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('menuBtn').setAttribute('aria-expanded','false');
}
function toggleTheme(){
  const r = document.documentElement;
  const cur = r.getAttribute('data-theme');
  const next = cur==='light' ? 'dark' : 'light';
  r.setAttribute('data-theme', next);
  try{ localStorage.setItem('nm-theme', next); }catch(e){}
}
const FONT_SIZES = [15,16,17,18,19,20,22,24];
function changeFontSize(dir){
  let sizes = FONT_SIZES;
  let cur = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--content-size')) || 18;
  let idx = sizes.reduce((best,v,i)=>Math.abs(v-cur)<Math.abs(sizes[best]-cur)?i:best, 0);
  let ni = dir===0 ? 3 : Math.min(sizes.length-1, Math.max(0, idx+dir));
  document.documentElement.style.setProperty('--content-size', sizes[ni]+'px');
  try{ localStorage.setItem('nm-fontsize', sizes[ni]); }catch(e){}
}
(function(){
  try{
    const s=localStorage.getItem('nm-theme'); if(s) document.documentElement.setAttribute('data-theme', s);
    const fs=localStorage.getItem('nm-fontsize'); if(fs) document.documentElement.style.setProperty('--content-size', fs+'px');
    const last = JSON.parse(localStorage.getItem('nm-last')||'null');
    if(last && DATA[last.c] && (last.t===null || DATA[last.c].topics[last.t])){ curC=last.c; curT=last.t; }
  }catch(e){}
})();

function renderSidebar(){
  const root = document.getElementById('chapterList');
  root.innerHTML = '';
  DATA.forEach((c, ci)=>{
    const wrap = document.createElement('div'); wrap.className='chapter';
    const row = document.createElement('button');
    row.className='chapter-row' + (ci===curC ? ' active-chapter' : '');
    row.setAttribute('aria-expanded', ci===curC ? 'true':'false');
    row.innerHTML = `<span class="chapter-arrow" aria-hidden="true">${ci===curC?'▾':'▸'}</span><span class="chapter-title">${esc(c.title)}</span>`;
    const copyBtn = document.createElement('button');
    copyBtn.className='chapter-copy'; copyBtn.textContent='📋'; copyBtn.setAttribute('aria-label','باب "'+c.title+'" کاپی کریں');
    copyBtn.onclick = (e)=>{ e.stopPropagation(); copyText(chapterPlainText(c), '✓ باب کاپی ہو گیا'); };
    row.appendChild(copyBtn);
    row.onclick = ()=>{ curC = ci; curT = null; renderAll(); if(window.innerWidth<=820) closeSidebar(); };
    wrap.appendChild(row);
    const tlist = document.createElement('div');
    tlist.className='topics' + (ci===curC?' open':'');
    c.topics.forEach((t, ti)=>{
      const tr = document.createElement('button');
      tr.className='topic-row' + (ci===curC && ti===curT ? ' active-topic':'');
      tr.textContent = t.title;
      tr.onclick = (e)=>{ e.stopPropagation(); curC=ci; curT=ti; renderAll(); if(window.innerWidth<=820) closeSidebar(); };
      tlist.appendChild(tr);
    });
    wrap.appendChild(tlist);
    root.appendChild(wrap);
  });
}

function renderBreadcrumb(){
  const b = document.getElementById('breadcrumb');
  const c = DATA[curC];
  let html = `<button onclick="curC=0;curT=null;renderAll()">نحو میر</button> / <button onclick="curT=null;renderAll()">${esc(c.title)}</button>`;
  if(curT!==null) html += ` / <span>${esc(c.topics[curT].title)}</span>`;
  b.innerHTML = html;
}

function renderContent(){
  const root = document.getElementById('content');
  const c = DATA[curC];
  try{ localStorage.setItem('nm-last', JSON.stringify({c:curC,t:curT})); }catch(e){}
  if(curT===null){
    let li = c.topics.map((t,ti)=>`<li><button class="ov-btn" onclick="curT=${ti};renderAll()"><div class="ov-title">${esc(t.title)}</div><div class="ov-excerpt">${renderMixed(t.content.slice(0,70))}…</div></button></li>`).join('');
    root.innerHTML = `
      <div class="content-header"><h1>${esc(c.title)}</h1><button class="btn" id="copyChapBtnMain">📋 پورا باب کاپی کریں</button></div>
      <div class="chapter-meta">${c.topics.length} موضوعات</div>
      ${c.topics.length ? `<ul class="chapter-overview-list">${li}</ul>` : `<div class="empty">اس باب میں کوئی موضوع موجود نہیں</div>`}
    `;
    document.getElementById('copyChapBtnMain').onclick = ()=>copyText(chapterPlainText(c), '✓ باب کاپی ہو گیا');
    return;
  }
  const t = c.topics[curT];
  const isFirst = curC===0 && curT===0, isLast = curC===DATA.length-1 && curT===c.topics.length-1;
  root.innerHTML = `
    <div class="content-header"><h1>${esc(t.title)}</h1>
      <div style="display:flex;gap:8px;">
        <button class="btn" id="copyTopicBtn">📋 موضوع کاپی کریں</button>
        <button class="btn" id="copyChapBtn">📋 پورا باب</button>
      </div>
    </div>
    <div class="topic-content">${renderMixed(t.content)}</div>
    <div class="navbtns">
      <button class="btn" ${isFirst?'disabled':''} onclick="prevTopic()">→ پچھلا موضوع</button>
      <button class="btn" ${isLast?'disabled':''} onclick="nextTopic()">اگلا موضوع ←</button>
    </div>
  `;
  document.getElementById('copyTopicBtn').onclick = ()=>copyText(topicPlainText(t), '✓ موضوع کاپی ہو گیا');
  document.getElementById('copyChapBtn').onclick = ()=>copyText(chapterPlainText(c), '✓ باب کاپی ہو گیا');
}
function prevTopic(){ if(curT>0){curT--; renderAll();} else if(curC>0){curC--; curT=DATA[curC].topics.length-1; renderAll();} }
function nextTopic(){
  const c=DATA[curC];
  if(curT<c.topics.length-1){curT++; renderAll();}
  else if(curC<DATA.length-1){curC++; curT=0; renderAll();}
}
function renderAll(){ renderSidebar(); renderBreadcrumb(); renderContent(); window.scrollTo(0,0); document.getElementById('main').scrollTop=0; }

// --- Search: pre-built flat index (built once) ---
const SEARCH_INDEX = [];
DATA.forEach((c,ci)=>{ c.topics.forEach((t,ti)=>{ SEARCH_INDEX.push({ci,ti,cTitle:c.title,tTitle:t.title,content:t.content}); }); });

function excerptAround(text, q){
  const i = text.indexOf(q);
  if(i<0) return text.slice(0,70)+'…';
  const start = Math.max(0, i-25);
  const end = Math.min(text.length, i+q.length+35);
  return (start>0?'…':'') + text.slice(start,end) + (end<text.length?'…':'');
}

const searchBox = document.getElementById('searchBox');
const searchResults = document.getElementById('searchResults');
const searchClearBtn = document.getElementById('searchClear');
let srIndex = -1, srItems = [];
let searchTimer = null;

function runSearch(){
  const q = searchBox.value.trim();
  searchClearBtn.classList.toggle('show', !!q);
  srIndex = -1;
  if(!q){ searchResults.classList.remove('open'); searchResults.innerHTML=''; return; }
  const matches = SEARCH_INDEX.filter(m => m.cTitle.includes(q) || m.tTitle.includes(q) || m.content.includes(q));
  if(matches.length===0){
    searchResults.innerHTML = '<div class="sr-item" style="cursor:default">کوئی تلاش کا نتیجہ نہیں ملا</div>';
    srItems = [];
  } else {
    const shown = matches.slice(0,25);
    let countLabel = matches.length>25 ? '25+ نتائج ملے' : matches.length + ' نتائج ملے';
    searchResults.innerHTML = `<div class="sr-count">${countLabel}</div>` + shown.map((m,i)=>
      `<div class="sr-item" role="option" data-idx="${i}" data-ci="${m.ci}" data-ti="${m.ti}">
        <div class="sr-path">${esc(m.cTitle)}</div>
        <div>${hl(m.tTitle,q)}</div>
        <div class="sr-preview">${hl(excerptAround(m.content,q), q)}</div>
      </div>`
    ).join('');
    srItems = Array.from(searchResults.querySelectorAll('.sr-item[data-ci]'));
    srItems.forEach(el=>{
      el.onclick = ()=>{ curC=+el.dataset.ci; curT=+el.dataset.ti; renderAll(); closeSearchResults(); };
    });
  }
  searchResults.classList.add('open');
}
searchBox.addEventListener('input', ()=>{ clearTimeout(searchTimer); searchTimer = setTimeout(runSearch, 150); });
function clearSearch(){ searchBox.value=''; runSearch(); searchBox.focus(); }
function closeSearchResults(){ searchResults.classList.remove('open'); searchBox.blur(); }
function updateActiveSr(){
  srItems.forEach((el,i)=>el.classList.toggle('sr-active', i===srIndex));
  if(srItems[srIndex]) srItems[srIndex].scrollIntoView({block:'nearest'});
}
searchBox.addEventListener('keydown', (e)=>{
  if(!searchResults.classList.contains('open') || srItems.length===0) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); srIndex=Math.min(srItems.length-1, srIndex+1); updateActiveSr(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); srIndex=Math.max(0, srIndex-1); updateActiveSr(); }
  else if(e.key==='Enter'){ if(srIndex>=0) srItems[srIndex].click(); }
});
document.addEventListener('click', (e)=>{ if(!document.getElementById('searchWrap').contains(e.target)) searchResults.classList.remove('open'); });
document.addEventListener('keydown', (e)=>{ if(e.key==='Escape'){ closeSearchResults(); closeSidebar(); } });

renderAll();
</script>
</body>
</html>
